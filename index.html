<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Spaceman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* ---------- Spotify + music (Phase 12) ---------- */
.sp-logo{flex:none;display:block}
.lv-music{flex:none}
.mus{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(11,12,16,.86);border:1px solid var(--line);color:var(--fg);text-align:left;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-decoration:none}
.mus .art{width:34px;height:34px;border-radius:8px;flex:none;object-fit:cover;background:var(--surface-3);display:grid;place-items:center;color:var(--fg-3)}
.mus .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.mus .txt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus .txt small{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus.idle .txt b{font-weight:500;color:var(--fg-2)}
.mus .eq{display:flex;gap:2px;align-items:flex-end;height:14px;flex:none}
.mus .eq i{width:3px;height:100%;background:var(--signal);border-radius:2px;transform-origin:bottom;animation:spEq 1s ease-in-out infinite}
.mus .eq i:nth-child(2){animation-delay:.25s}.mus .eq i:nth-child(3){animation-delay:.5s}
.mus .cta{font-size:13px;font-weight:600;color:var(--ion);flex:none}
@keyframes spEq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.mus .eq i{animation:none;transform:scaleY(.7)}}
.live.day .mus{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.sp-sec{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:10px}
.sp-h{display:flex;align-items:center;gap:10px}
.sp-h h3{margin:0;flex:1}
.sp-h .sp-tag{font-size:11.5px;color:var(--fg-3);font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.sp-chips{display:flex;flex-wrap:wrap;gap:8px}
.sp-sub{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin:2px 0 -4px}
.sp-list{display:flex;flex-direction:column}
.sp-item{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--fg);text-decoration:none;min-height:48px}
.sp-item + .sp-item{border-top:1px solid var(--line)}
.sp-item .n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sp-item .n b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .n small{font-size:12.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .rk{width:18px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.sp-img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-3)}
.sp-img.r{border-radius:50%}
.sp-img.ph{display:grid;place-items:center;color:var(--fg-3);font-weight:600}
.sp-empty{display:flex;align-items:center;gap:12px;color:var(--fg-2);font-size:14px;line-height:1.4}
.sp-empty .ic-tile{flex:none}
.sp-foot{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.sp-status .sp-logo{margin:0 2px}
.sp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp-tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;min-width:0}
.sp-tile b{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.sp-tile small{color:var(--fg-2);font-size:12.5px}
.sp-tile.wide{grid-column:1 / -1}
.sp-mom{display:flex;gap:12px;align-items:baseline;padding:10px 0;font-size:14px;line-height:1.4}
.sp-mom + .sp-mom{border-top:1px solid var(--line)}
.sp-mom .mono{color:var(--fg-3);font-size:12px;flex:none}
.sp-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg-2);font-size:14px;line-height:1.45}
.sp-code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;color:var(--fg)}
.tx.roast.music .eyebrow.tx-kind{color:var(--signal)}
/* Layout: mobile-first single column under a floating glass dock with a centre Launch button;
   at ≥960px the dock becomes a left rail and content centres at 720px. Single deliberate dark theme. */
:root{
  color-scheme: dark;
  /* Colour */
  --void:#000000;          /* background */
  --surface:#0B0C10;       /* cards */
  --surface-2:#13151B;     /* raised / inputs */
  --surface-3:#1D2028;     /* tracks, pressed */
  --line:rgba(214,224,255,.07);
  --line-2:rgba(214,224,255,.13);
  --fg:#FFFFFF;            /* starlight */
  --fg-2:#9EA4B2;          /* dust */
  --fg-3:#868D9C;          /* deep dust */
  --ion:#7C9CFF;           /* accent: ion blue */
  --nebula:#B39CFF;        /* accent partner: soft purple, gradients only */
  --ion-soft:rgba(124,156,255,.14);
  --signal:#62D9A6;        /* success */
  --flare:#F2B766;         /* warning / streaks */
  --glass:rgba(19,21,27,.72);
  --danger:#FF8A8A;
  /* Type */
  --font-display:'Unbounded', 'Geist', system-ui, sans-serif;
  --font-body:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  /* Shape + motion */
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.32,1.25,.5,1);
  --fast:160ms; --base:260ms; --slow:420ms;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ion);outline-offset:3px}
svg{display:block}

/* ---------- Type ---------- */
.display{font-family:var(--font-display);font-weight:500;letter-spacing:-.035em;line-height:1.04;text-wrap:balance}
.t-hero{font-size:clamp(30px,8.4vw,40px)}
.t-title{font-size:26px}
.t-num{font-family:var(--font-display);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.eyebrow.ion{color:var(--ion)}
.muted{color:var(--fg-2)}
.small{font-size:14px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h2.sec{font-size:17px;font-weight:600;letter-spacing:-.01em}

/* ---------- App shell ---------- */
.view{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(132px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:36px}
.view.enter{animation:pageIn var(--base) var(--ease)}
.view.enter > *{animation:rise 420ms var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pageIn{from{opacity:.4}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h a,.sec-h button{font-size:13px;color:var(--fg-2);display:inline-flex;align-items:center;gap:2px}
.sec-h a:hover{color:var(--fg)}
.stack-v{display:flex;flex-direction:column;gap:12px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:500;font-size:17px;letter-spacing:-.03em}
.brandmark svg{width:28px;height:28px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);background:var(--surface);border:1px solid var(--line);position:relative;transition:transform var(--fast) var(--ease),color var(--fast)}
.icon-btn:hover{color:var(--fg)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--ion);box-shadow:0 0 0 2px var(--surface)}
.page-h{display:flex;flex-direction:column;gap:14px}
.page-h .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-size:15px;height:44px;padding-right:8px;margin-left:-6px}
.back:hover{color:var(--fg)}

/* Dock (mobile) / Rail (desktop) */
.dock-fade{position:fixed;left:0;right:0;bottom:0;height:calc(130px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.92) 62%);pointer-events:none;z-index:39}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:70px;padding:0 6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line-2);box-shadow:0 24px 48px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
.rail-brand,.rail-sec,.rail-foot{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--fg-3);border-radius:999px;transition:color var(--fast),transform var(--fast) var(--ease)}
.tab:hover{color:var(--fg-2)}
.tab:active{transform:scale(.9)}
.tab[aria-current="page"]{color:var(--fg)}
.tab .tab-ic{position:relative}
.tab[aria-current="page"] .tab-ic::after{content:"";position:absolute;left:50%;bottom:-25px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ion);box-shadow:0 0 8px var(--ion)}
.tab .lbl-d{display:none}
.launch{justify-self:center;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--void);box-shadow:0 0 0 6px rgba(124,156,255,.10),0 10px 30px rgba(124,156,255,.38);transition:transform var(--fast) var(--ease),box-shadow var(--base)}
.launch:hover{box-shadow:0 0 0 8px rgba(124,156,255,.16),0 12px 36px rgba(124,156,255,.5)}
.launch:active{transform:scale(.9)}
.launch svg{width:28px;height:28px}
.launch .lbl{display:none}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.press{transition:transform var(--fast) var(--ease),border-color var(--base),background var(--base)}
.press:active{transform:scale(.982)}
@media (hover:hover){.press:hover{border-color:var(--line-2)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;letter-spacing:-.005em;transition:transform var(--fast) var(--ease),background var(--base),box-shadow var(--base)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--fg);color:var(--void)}
.btn-primary:hover{box-shadow:0 8px 30px rgba(124,156,255,.35)}
.btn-secondary{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2)}
.btn-ghost{color:var(--fg-2);padding:0 12px}
.btn-ghost:hover{color:var(--fg)}
.btn-lg{height:56px;padding:0 28px;font-size:16px}
.btn-block{width:100%}
.btn svg.hm{width:22px;height:22px}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
.chip.ion{background:var(--ion-soft);color:var(--ion);border-color:rgba(124,156,255,.25)}
.chip.ok{color:var(--signal);background:rgba(98,217,166,.10);border-color:rgba(98,217,166,.22)}
.chip.soon{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;height:22px;padding:0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:2px max(20px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.filter{height:36px;padding:0 15px;font-size:13px;cursor:pointer;transition:all var(--fast)}
.filter[aria-pressed="true"]{background:var(--fg);color:var(--void);border-color:var(--fg)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);position:relative}
.seg > *{height:42px;gap:6px;display:flex !important;align-items:center;justify-content:center;border-radius:999px;display:grid;place-items:center;font-size:13.5px;font-weight:500;color:var(--fg-2);transition:color var(--fast),background var(--base) var(--ease)}
.seg > [aria-current="page"],.seg > [aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;width:var(--p);border-radius:inherit;background:linear-gradient(90deg,var(--ion),var(--nebula));transform-origin:left;animation:grow 900ms var(--ease) 120ms both}
.bar.thin{height:4px}
.bar.mute > i{background:var(--fg-3)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ring-prog{transition:stroke-dashoffset 1s var(--ease);animation:ringIn 1.1s var(--ease) both}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}

.av{--s:36px;--h:220;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:500;font-size:calc(var(--s) * .38);color:var(--fg);background:radial-gradient(circle at 30% 25%,hsl(var(--h) 52% 60%),hsl(var(--h) 42% 22%) 78%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.avs{display:flex;--ring:var(--surface)}
.avs .av{box-shadow:0 0 0 2.5px var(--ring)}
.avs .av + .av{margin-left:calc(var(--s) * -.28)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .t-num{font-size:22px}
.tile .lbl{font-size:13px;color:var(--fg-2);line-height:1.3}
.tile .unit{font-family:var(--font-body);font-size:12px;color:var(--fg-2);letter-spacing:0;margin-left:2px}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;width:100%;transition:background var(--fast)}
.list > .row + .row{border-top:1px solid var(--line)}
button.row:hover,a.row:hover{background:rgba(255,255,255,.02)}
button.row:active,a.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .grow b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{font-size:14px;color:var(--fg-2)}
.row .chev{color:var(--fg-3);flex:none}
.ic-tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.ic-tile.ion{background:var(--ion-soft);border-color:rgba(124,156,255,.22);color:var(--ion)}

.switch{width:52px;height:32px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background var(--base)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--fg-2);transition:transform var(--base) var(--spring),background var(--base)}
.switch[aria-checked="true"]{background:var(--ion)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--fg)}

/* Medals */
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 10px}
.medal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.medal-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:radial-gradient(circle at 35% 28%,rgba(124,156,255,.42),rgba(124,156,255,.06) 70%);border:1px solid rgba(124,156,255,.45);box-shadow:0 0 24px rgba(124,156,255,.15);position:relative;transition:transform var(--base) var(--spring)}
.medal:hover .medal-ic{transform:scale(1.06) rotate(-4deg)}
.medal b{font-size:13.5px;font-weight:500;line-height:1.25}
.medal span{font-size:12px;color:var(--fg-3);font-family:var(--font-mono)}
.medal.locked .medal-ic{background:var(--surface);border:1px dashed var(--line-2);color:var(--fg-3);box-shadow:none}
.medal.locked b{color:var(--fg-2)}
.medal-scroll{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:4px max(20px,env(safe-area-inset-left,0px))}
.medal-scroll::-webkit-scrollbar{display:none}
.medal-scroll .medal{width:84px;flex:none}

/* ---------- Home ---------- */
.hello{display:flex;flex-direction:column;gap:6px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-2);background:radial-gradient(120% 90% at 100% 0%,rgba(124,156,255,.20),rgba(124,156,255,0) 55%),radial-gradient(80% 60% at 0% 100%,rgba(179,156,255,.10),rgba(179,156,255,0) 60%),#05060A;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.orbit{position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(214,224,255,.08);z-index:-1}
.orbit::before{content:"";position:absolute;inset:44px;border-radius:50%;border:1px solid rgba(214,224,255,.06)}
.orbit i{position:absolute;inset:0;animation:spin 28s linear infinite}
.orbit i::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ion);box-shadow:0 0 14px 2px var(--ion)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-in{padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px}
.hero-in .btn{align-self:flex-start;margin-top:8px}
.hero-foot{display:flex;align-items:center;gap:10px;padding:14px 24px;min-height:58px;border-top:1px solid var(--line);font-size:14px;color:var(--fg-2);background:rgba(0,0,0,.35)}
.hero-foot .avs{--ring:#05060A}

.crew-mini{display:flex;flex-direction:column;gap:16px}
.crew-top{display:flex;align-items:center;gap:14px}
.emblem{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#1B2240,#0B0D16);border:1px solid rgba(124,156,255,.3);color:var(--fg)}
.emblem svg{width:26px;height:26px}
.xp-row{display:flex;justify-content:space-between;font-size:13px;color:var(--fg-2);margin-bottom:8px}

.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa .card{padding:16px;display:flex;flex-direction:column;gap:14px;min-height:118px;text-align:left}
.qa .card b{font-weight:500;display:block}
.qa .card span{font-size:12.5px;color:var(--fg-2)}
.qa .top{display:flex;justify-content:space-between;align-items:flex-start}

/* Journey cards */
.jcard{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer}
.jmap{height:116px;position:relative;background:radial-gradient(circle,rgba(214,224,255,.075) 1px,rgba(0,0,0,0) 1.3px) 0 0/14px 14px,linear-gradient(180deg,#0E1017,#090A0E);border-bottom:1px solid var(--line)}
.jmap svg{position:absolute;inset:0;width:100%;height:100%}
.jmap .tag{position:absolute;left:14px;top:12px}
.jbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.jbody h3{font-size:17px;font-weight:600;letter-spacing:-.015em}
.jstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jstats b{display:block;font-family:var(--font-display);font-weight:500;font-size:17px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.jstats span{font-size:12.5px;color:var(--fg-3)}
.jfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.jfoot .song{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);min-width:0}
.jfoot .song span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-h{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:4px 0 -2px}

/* Friends */
.pair{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-2);background:radial-gradient(90% 70% at 50% 0%,rgba(124,156,255,.16),rgba(124,156,255,0) 70%),var(--surface);padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.pair-avs{display:flex;align-items:center;position:relative}
.pair-avs .av{box-shadow:0 0 0 3px var(--surface)}
.pair-avs .av + .av{margin-left:-14px}
.pair-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pair-stats > div{padding:14px 4px;display:flex;flex-direction:column;gap:6px}
.pair-stats > div + div{border-left:1px solid var(--line)}
.pair-stats .t-num{font-size:22px}
.pair-stats span{font-size:12.5px;color:var(--fg-3)}
.pair-stats .t-num{color:var(--fg)}
.moon{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.moon .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--fg-2)}
.friend-bar{margin-top:6px}

/* Crew */
.crew-id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:6px}
.lvl-ring{position:relative;width:132px;height:132px}
.lvl-ring svg{width:100%;height:100%}
.lvl-ring .c{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.lvl-ring .t-num{font-size:40px}
.member-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.member{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.timeline{display:flex;flex-direction:column}
.ms{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:22px}
.ms:last-child{padding-bottom:0}
.ms::before{content:"";position:absolute;left:13.5px;top:26px;bottom:-2px;width:1px;background:var(--line-2)}
.ms:last-child::before{display:none}
.ms .node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--fg-3)}
.ms.done .node{background:var(--fg);border-color:var(--fg);color:var(--void)}
.ms.now .node{border-color:var(--ion);color:var(--ion);box-shadow:0 0 0 4px var(--ion-soft)}
.ms .body{display:flex;flex-direction:column;gap:3px;padding-top:3px;min-width:0}
.ms .body b{font-weight:500}
.ms .body span{font-size:13px;color:var(--fg-2)}
.ms.now .bar{margin-top:8px}
.ghost-rows{display:flex;flex-direction:column;gap:10px;filter:blur(2.5px);opacity:.5;pointer-events:none;margin-top:14px}
.ghost-rows div{height:16px;border-radius:8px;background:var(--surface-3)}

/* Challenges */
.season{display:flex;flex-direction:column;gap:14px;background:radial-gradient(100% 120% at 0% 0%,rgba(179,156,255,.16),rgba(179,156,255,0) 60%),var(--surface)}
.season .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.daily{display:flex;flex-direction:column;gap:14px;border-color:rgba(124,156,255,.28)}
.cat-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--fg);background:hsl(var(--h) 40% 14%);border:1px solid hsl(var(--h) 50% 30% / .55)}
.row .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--fg-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden}
.status-done{color:var(--signal)}

/* Profile */
.me{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.me-av{position:relative;width:112px;height:112px;display:grid;place-items:center}
.me-av svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.me-av .lvl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--void);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px}
.premium{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;border-color:rgba(179,156,255,.3);background:linear-gradient(135deg,rgba(124,156,255,.14),rgba(179,156,255,.06) 50%,rgba(0,0,0,0)),var(--surface)}
.premium .hm{position:absolute;right:-24px;bottom:-30px;width:150px;height:150px;color:rgba(255,255,255,.05)}

/* Stats */
.big-stat{display:flex;flex-direction:column;gap:10px}
.big-stat .t-num{font-size:clamp(52px,15vw,72px)}
.big-stat .unit{font-family:var(--font-body);font-size:18px;color:var(--fg-2);letter-spacing:0;margin-left:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .tile .t-num{font-size:26px}
.chart{width:100%;height:auto;overflow:visible}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:12px 0}
.rank + .rank{border-top:1px solid var(--line)}
.rank .n{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.rank b{font-weight:500;display:block}
.rank small{font-size:12.5px;color:var(--fg-2)}
.fact{display:flex;gap:14px;align-items:flex-start}

/* Roadmap */
.rm{display:flex;flex-direction:column;gap:14px}
.rm .top{display:flex;align-items:flex-start;gap:14px}
.rm .top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rm .top b{font-weight:600}
.rm p{font-size:13.5px;color:var(--fg-2)}
.rm .foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.notify{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line-2);color:var(--fg);transition:all var(--fast)}
.notify[aria-pressed="true"]{background:var(--ion-soft);border-color:rgba(124,156,255,.35);color:var(--ion)}

/* Brand page */
.brand-hero{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:36px 20px;border-radius:var(--r-xl);border:1px solid var(--line);background:radial-gradient(70% 60% at 50% 30%,rgba(124,156,255,.14),rgba(0,0,0,0) 70%),var(--void)}
.brand-hero .logo{width:112px;height:112px;color:var(--fg);filter:drop-shadow(0 0 30px rgba(124,156,255,.3))}
.wordmark{font-family:var(--font-display);font-weight:500;font-size:34px;letter-spacing:-.045em}
.icons-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.appicon{display:grid;place-items:center;background:var(--void);border-radius:23%;border:1px solid var(--line-2);color:var(--fg);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.appicon.inv{background:var(--fg);color:var(--void)}
.appicon.ion{background:radial-gradient(circle at 50% 30%,#22305E,#06070C 75%)}
.appicon svg{width:62%;height:62%}
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.sw i{display:block;height:64px}
.sw div{padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.sw b{font-weight:500;font-size:13px}
.sw span{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.type-row{display:flex;flex-direction:column;gap:4px;padding:16px 0}
.type-row + .type-row{border-top:1px solid var(--line)}
.tok{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.tok i{display:block;background:var(--ion-soft);border:1px solid rgba(124,156,255,.35);border-radius:3px;height:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{text-align:left;padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
td:first-child{font-weight:500;white-space:nowrap}
td{color:var(--fg-2)}
td b{color:var(--fg);font-weight:500}
tr.pick td{background:rgba(124,156,255,.06)}
pre.tree{margin:0;padding:18px;font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--fg-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
pre.tree b{color:var(--fg);font-weight:500}
.comp-grid{display:flex;flex-direction:column;gap:18px}
.comp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.motion-row{display:grid;grid-template-columns:90px 1fr 60px;gap:12px;align-items:center;font-size:13px;padding:10px 0}
.motion-row + .motion-row{border-top:1px solid var(--line)}
.motion-row .track{height:6px;border-radius:99px;background:var(--surface-3);position:relative;overflow:hidden}
.motion-row .track i{position:absolute;top:0;bottom:0;width:22%;border-radius:99px;background:var(--fg);animation:slide var(--d) var(--ease) infinite alternate}
@keyframes slide{from{left:0}to{left:78%}}

/* ---------- Sheets ---------- */
.sheet-root{position:fixed;inset:0;z-index:150}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity var(--base)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform var(--slow) var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.7)}
.sheet-root.open .scrim{opacity:1}
.sheet-root.open .sheet{transform:none}
.grab{height:28px;display:grid;place-items:center;cursor:grab;touch-action:none;margin:0 -20px}
.grab::before{content:"";width:40px;height:5px;border-radius:99px;background:var(--surface-3)}
.sheet-x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2)}
.sheet-body{display:flex;flex-direction:column;gap:24px;max-width:520px;margin:0 auto}
.field{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);transition:border-color var(--fast)}
.field:focus-within{border-color:var(--ion)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.field input::placeholder{color:var(--fg-3)}
.pick-crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);position:relative}
.pick .av{transition:transform var(--base) var(--spring),opacity var(--base),filter var(--base)}
.pick[aria-pressed="false"] .av{opacity:.35;filter:grayscale(1)}
.pick[aria-pressed="true"]{color:var(--fg)}
.pick .tick{position:absolute;top:34px;left:calc(50% + 12px);width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--void);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface);transform:scale(0);transition:transform var(--base) var(--spring)}
.pick[aria-pressed="true"] .tick{transform:scale(1)}
.sum{display:flex;gap:8px;flex-wrap:wrap}

/* Unlock */
.unlock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 0 4px;position:relative}
.unlock .medal-ic{width:104px;height:104px;margin-bottom:10px;animation:medalIn 900ms var(--spring) both}
.unlock .medal-ic::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(124,156,255,.6);animation:halo 1.6s var(--ease) 300ms infinite}
.unlock .medal-ic svg{width:42px;height:42px}
.burst{position:absolute;top:64px;left:50%;width:0;height:0}
.burst i{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--fg);opacity:0;animation:spark 900ms var(--ease) 200ms forwards;transform:rotate(var(--a)) translateY(0)}
.burst i:nth-child(3n){background:var(--ion)}
.burst i:nth-child(4n){background:var(--nebula);width:3px;height:3px}
@keyframes medalIn{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:none}}
@keyframes halo{from{transform:scale(1);opacity:.8}to{transform:scale(1.45);opacity:0}}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-90px)}}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:300;transform:translate(-50%,-140%);display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line-2);font-size:13.5px;font-weight:500;transition:transform var(--slow) var(--spring);white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--void);display:grid;place-items:center;flex:none}

/* ---------- Live journey ---------- */
.live{position:fixed;inset:0;z-index:100;background:var(--void);overflow-y:auto;isolation:isolate;animation:pageIn var(--base) var(--ease)}
.live canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.live-in{max-width:520px;margin:0 auto;min-height:100%;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.countdown{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:28px;text-align:center}
.cd-ring{position:relative;width:200px;height:200px}
.cd-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:84px;font-weight:500;letter-spacing:-.05em}
.cd-ring .n span{animation:tick 900ms var(--ease) both}
@keyframes tick{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.8);opacity:0}}
.live-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.live-pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,80,80,.1);border:1px solid rgba(255,110,110,.3);color:#FF8A8A;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#FF6B6B;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.live-miles{display:flex;flex-direction:column;gap:4px;padding:10px 0}
.live-miles .t-num{font-size:clamp(76px,24vw,112px);letter-spacing:-.05em}
.live-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.live-meta .tile{background:rgba(11,12,16,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.np{display:flex;flex-direction:column;gap:12px;background:rgba(11,12,16,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.np .top{display:flex;align-items:center;gap:12px}
.np .art{width:48px;height:48px;border-radius:10px;flex:none;background:conic-gradient(from 200deg,#1E2A55,#3B2E66,#0F1A33,#1E2A55);display:grid;place-items:center;color:rgba(255,255,255,.7)}
.np .bar > i{animation:none;transition:width .3s linear}
.counter{display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(11,12,16,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.plus{width:72px;height:72px;border-radius:50%;flex:none;background:var(--fg);color:var(--void);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;font-weight:500;transition:transform var(--fast) var(--ease)}
.plus:active{transform:scale(.88)}
.bump{animation:bump 320ms var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
.float-xp{position:absolute;font-family:var(--font-mono);font-size:12px;color:var(--ion);pointer-events:none;animation:floatUp 800ms var(--ease) forwards}
@keyframes floatUp{to{transform:translateY(-36px);opacity:0}}

/* ---------- v0.2 ---------- */
:root.hc{--fg-2:#D3D7E0;--fg-3:#ADB3C0;--line:rgba(214,224,255,.17);--line-2:rgba(214,224,255,.32);--surface:#0F1117;--surface-2:#191C24}
.launch[aria-current="page"]{box-shadow:0 0 0 2px var(--fg),0 0 0 7px rgba(124,156,255,.35),0 10px 30px rgba(124,156,255,.45)}
.btn-xl{height:64px;padding:0 30px;font-size:18px;gap:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-size:14px;font-weight:500;color:var(--fg-2)}
.link-btn:hover{color:var(--fg)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ftop{display:flex;align-items:center;gap:14px;min-width:0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.who b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.who > span{font-size:14px;color:var(--fg-2)}
.pair-mini{display:inline-flex;flex:none}
.pair-mini .av{box-shadow:0 0 0 2.5px var(--surface)}
.pair-mini .av + .av{margin-left:-10px}
.lvl-badge{position:relative;flex:none;display:inline-block}
.lvl-badge svg{width:100%;height:100%}
.lvl-badge .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sheet-title{display:flex;flex-direction:column;gap:8px;padding-right:52px}
.field-row{display:flex;gap:10px;align-items:stretch}
.field-row .field{min-width:0}
.field-row .field input{width:100%}
.field-row .btn{flex:none}
.title-input{width:100%;background:none;border:0;border-bottom:1px dashed var(--line-2);padding:6px 0;font-family:var(--font-display);font-weight:500;font-size:28px;letter-spacing:-.035em;line-height:1.15;color:var(--fg);outline:0;border-radius:0}
.title-input::placeholder{color:var(--fg);opacity:1}
.title-input:focus{border-bottom-color:var(--ion)}
.title-input:focus::placeholder{color:var(--fg-3)}
.recap-hint{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.recap-map{height:170px;border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
/* home */
.hero-foot .grow-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-foot .change{flex:none;display:inline-flex;align-items:center;gap:2px;color:var(--fg);font-weight:500}
.crew-row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:4px max(20px,env(safe-area-inset-left,0px)) 6px}
.crew-row::-webkit-scrollbar{display:none}
.crew-pill{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--fg-2);text-align:center}
.crew-pill .ring-av{position:relative;width:68px;height:68px;display:grid;place-items:center;transition:transform var(--base) var(--spring)}
.crew-pill:active .ring-av{transform:scale(.92)}
.crew-pill .ring-av > svg{position:absolute;inset:0;width:100%;height:100%}
.crew-pill .lv{position:absolute;right:-3px;bottom:-3px;min-width:26px;height:24px;padding:0 7px;border-radius:999px;background:var(--fg);color:var(--void);font-family:var(--font-mono);font-size:12px;font-weight:500;display:grid;place-items:center;box-shadow:0 0 0 3px var(--void)}
.add-pill .ring-av{border:1.5px dashed var(--line-2);border-radius:50%;color:var(--fg-2)}
.add-pill .ring-av > svg{position:static;width:24px;height:24px}
.fprog{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;background:radial-gradient(100% 120% at 100% 0%,rgba(124,156,255,.15),rgba(0,0,0,0) 60%),var(--surface)}
.fprog-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fprog-h{font-size:20px;line-height:1.3;letter-spacing:-.01em;font-weight:500;text-wrap:balance}
.fprog-h b{font-family:var(--font-display);font-weight:500;letter-spacing:-.02em}
.streak{display:flex;flex-direction:column;gap:16px}
.streak-top{display:flex;gap:14px;align-items:center}
.streak-top > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.streak-n{font-family:var(--font-display);font-weight:500;font-size:20px;letter-spacing:-.02em}
.ic-tile.lit{color:var(--flare);background:rgba(242,183,102,.12);border-color:rgba(242,183,102,.3)}
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.weeks i{height:8px;border-radius:99px;background:var(--surface-3)}
.weeks i.on{background:linear-gradient(90deg,var(--flare),#F7D29C)}
.weeks i.now{outline:1.5px solid var(--fg-3);outline-offset:2px}
/* memories */
.mem-feature{display:block;width:100%;text-align:left;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-2);background:radial-gradient(110% 80% at 100% 0%,hsl(var(--h) 70% 55% / .30),rgba(0,0,0,0) 60%),radial-gradient(90% 70% at 0% 100%,hsl(calc(var(--h) + 50) 60% 55% / .14),rgba(0,0,0,0) 60%),#05060A}
.mem-feature .art{position:relative;display:block;height:170px;background:radial-gradient(circle,rgba(214,224,255,.07) 1px,rgba(0,0,0,0) 1.3px) 0 0/14px 14px}
.mem-feature .art svg{position:absolute;inset:0;width:100%;height:100%}
.mem-feature .tag{position:absolute;left:18px;top:16px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mem-feature .body{padding:4px 22px 22px;display:flex;flex-direction:column;gap:14px}
.mem-title{font-family:var(--font-display);font-weight:500;font-size:26px;letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.mem-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--fg-2);align-items:baseline}
.mem-stats b{font-family:var(--font-display);font-weight:500;color:var(--fg);font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mem-crew{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg-2);min-width:0}
.mem-crew > span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-song{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2);padding-top:14px;border-top:1px solid var(--line)}
.mem-song span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.mem-song{padding:16px 18px}
.awards-line{display:flex;gap:8px;flex-wrap:wrap}
.award-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 5px;border-radius:999px;background:rgba(242,183,102,.10);border:1px solid rgba(242,183,102,.28);color:var(--flare);font-size:13px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mem-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;width:100%;text-align:left;padding:10px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.sheet .mem-row{background:var(--surface-2)}
.mem-thumb{position:relative;display:block;border-radius:14px;overflow:hidden;aspect-ratio:1;max-width:100%;background:radial-gradient(circle,rgba(214,224,255,.07) 1px,rgba(0,0,0,0) 1.3px) 0 0/10px 10px,radial-gradient(100% 100% at 100% 0%,hsl(var(--h) 70% 55% / .28),rgba(0,0,0,0) 70%),#08090D}
.mem-thumb svg{position:absolute;inset:0;width:100%;height:100%}
.mem-row .txt{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding-right:6px}
.mem-row .txt > b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-row .meta{font-size:13.5px;color:var(--fg-2)}
.row-crew{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-width:0}
.aw-mini{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--flare);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.aw-mini svg{flex:none}
.month-h{margin:10px 0 0}
/* crew */
.fcard{display:flex;flex-direction:column;gap:16px;width:100%;text-align:left}
.fstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fstats > span{display:flex;flex-direction:column;gap:3px;min-width:0}
.fstats b{font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstats > span > span{font-size:12.5px;color:var(--fg-3)}
.fprog-line{display:block;font-size:14px;color:var(--fg-2);margin-bottom:-8px}
.fmeta{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--fg-2);min-width:0}
.fmeta > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta svg{flex:none}
.guest{display:flex;flex-direction:column;gap:14px;border-style:dashed;border-color:var(--line-2)}
.pair{width:100%;cursor:pointer}
.pair-name{font-size:24px}
.pair-stats > span{padding:14px 4px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair-stats > span + span{border-left:1px solid var(--line)}
.fs-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:4px}
.fs-head .pair-avs .av{box-shadow:0 0 0 3px var(--surface)}
.fs-level{display:flex;align-items:center;gap:18px;background:var(--surface-2)}
.sheet .tile{background:var(--surface-2)}
.ms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ms-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r-md);background:radial-gradient(120% 90% at 0% 0%,rgba(124,156,255,.16),rgba(0,0,0,0) 60%),var(--surface-2);border:1px solid rgba(124,156,255,.3);text-align:left;min-height:160px;min-width:0}
.ms-card .ms-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:radial-gradient(circle at 35% 28%,rgba(124,156,255,.5),rgba(124,156,255,.08) 70%);border:1px solid rgba(124,156,255,.5);box-shadow:0 0 20px rgba(124,156,255,.2);transition:transform var(--base) var(--spring)}
button.ms-card:hover .ms-ic{transform:scale(1.08) rotate(-6deg)}
.ms-card b{font-size:15px;font-weight:600;line-height:1.25}
.ms-card .q{font-size:13.5px;color:var(--fg-2);line-height:1.4}
.ms-card .when{margin-top:auto;font-family:var(--font-mono);font-size:12px;color:var(--ion)}
.ms-card.locked{background:var(--surface);border:1px dashed var(--line-2)}
.ms-card.locked .ms-ic{background:none;border:1px dashed var(--line-2);color:var(--fg-3);box-shadow:none}
.ms-card.locked b{color:var(--fg-2)}
.ms-card.locked .when{color:var(--fg-3)}
/* go */
.go-card{display:flex;flex-direction:column;gap:18px}
.go-crew{display:flex;flex-wrap:wrap;gap:16px}
.go-crew .member{min-width:56px}
.go-list{margin:0 -20px -20px;border-radius:0 0 var(--r-lg) var(--r-lg);border:0;border-top:1px solid var(--line);background:none}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .grow b{font-weight:600}
.li .grow span{font-size:14px;color:var(--fg-2);line-height:1.4}
.seat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seat{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:136px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2);text-align:left;transition:border-color var(--fast),background var(--fast)}
.seat svg{color:var(--fg)}
.seat b{color:var(--fg);font-weight:600;font-size:16px}
.seat span{font-size:14px;line-height:1.4}
.seat[aria-pressed="true"]{border-color:var(--ion);background:var(--ion-soft);color:var(--fg)}
.pick-crew{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:16px 10px}
.pick{font-size:14px}
.pick .tick{top:38px;left:calc(50% + 14px)}
.guest-tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--flare);margin-top:-4px}
/* recap + celebrations */
.recap{gap:26px}
.recap-head{display:flex;flex-direction:column;gap:8px}
.fp{display:flex;flex-direction:column;gap:12px}
.fp-top{display:flex;align-items:center;gap:12px}
.fp-top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fp-top .grow b{font-weight:600}
.from-to{font-family:var(--font-mono);font-size:13px;color:var(--fg-2)}
.gain{font-family:var(--font-display);font-weight:500;font-size:22px;letter-spacing:-.03em;color:var(--signal);font-variant-numeric:tabular-nums}
.fp-foot{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--fg-2);flex-wrap:wrap}
.bar > i.grow-from{transform:none;animation:fromTo 1.4s var(--ease) .5s both}
@keyframes fromTo{from{width:var(--from)}to{width:var(--p)}}
.celebrate{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 22px 26px;border-radius:var(--r-xl);border:1px solid rgba(124,156,255,.38);background:radial-gradient(80% 70% at 50% 0%,rgba(124,156,255,.26),rgba(0,0,0,0) 70%),var(--surface)}
.celebrate .medal-ic{width:88px;height:88px;margin-bottom:8px;animation:medalIn 900ms var(--spring) both}
.celebrate .medal-ic::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(124,156,255,.6);animation:halo 1.6s var(--ease) 300ms infinite}
.celebrate .burst{top:74px}
.celebrate p{max-width:32ch}
.claim{display:flex;flex-direction:column;gap:16px;border-color:rgba(242,183,102,.32);background:radial-gradient(100% 90% at 0% 0%,rgba(242,183,102,.12),rgba(0,0,0,0) 60%),var(--surface)}
.sheet .claim{background:radial-gradient(100% 90% at 0% 0%,rgba(242,183,102,.12),rgba(0,0,0,0) 60%),var(--surface-2)}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r-md);background:var(--void);border:1px dashed var(--line-2)}
.code-box .t-num{font-size:24px;letter-spacing:.06em;user-select:all}
.msg-box{padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:15px;line-height:1.55;user-select:all}
.award{display:flex;align-items:center;gap:14px;padding:14px 16px}
.list > .award + .award{border-top:1px solid var(--line)}
.trophy{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--flare);background:rgba(242,183,102,.10);border:1px solid rgba(242,183,102,.3)}
.award .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.award .txt b{font-weight:600}
.award .txt span{font-size:14px;color:var(--fg-2);line-height:1.4}
.together{display:flex;flex-wrap:wrap;gap:8px}
.together .chip{height:36px;padding:0 12px 0 6px;font-size:13.5px;color:var(--signal)}
.share-prev{display:grid;grid-template-columns:148px minmax(0,1fr);gap:18px;align-items:center}
.story{position:relative;aspect-ratio:9/16;width:100%;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:radial-gradient(130% 70% at 50% 0%,hsl(var(--h) 70% 50% / .55),rgba(0,0,0,0) 70%),#05060A;box-shadow:0 18px 40px rgba(0,0,0,.6);color:#fff}
.story .s-top{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:10px}
.story .s-top svg{width:14px;height:14px}
.story .s-route{display:block;height:80px;position:relative}
.story .s-route svg{position:absolute;inset:0;width:100%;height:100%}
.story .s-mi{display:block;font-family:var(--font-display);font-weight:500;font-size:28px;letter-spacing:-.04em;line-height:1}
.story .s-mi small{font-size:10px;letter-spacing:0;color:#B7BCC8;font-family:var(--font-body)}
.story .s-t{display:block;font-size:11px;font-weight:600;line-height:1.25;margin-top:6px}
.story .s-aw{font-size:9.5px;color:#F2B766;display:flex;gap:4px;align-items:center}
.share-copy{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
@media (max-width:360px){.share-prev{grid-template-columns:1fr}.story{max-width:200px}}
/* you */
.wrapped{display:flex;flex-direction:column;gap:16px;border-color:rgba(179,156,255,.32);background:radial-gradient(120% 80% at 100% 0%,rgba(179,156,255,.24),rgba(0,0,0,0) 60%),radial-gradient(90% 70% at 0% 100%,rgba(124,156,255,.16),rgba(0,0,0,0) 60%),var(--surface)}
.wr-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wr-title{font-size:28px}
.wr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wr-grid > div{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);background:rgba(0,0,0,.4);border:1px solid var(--line);min-width:0;min-height:100px}
.wr-grid .k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.wr-grid .v{font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:-.03em;margin-top:auto}
.wr-grid .v small{font-size:13px;color:var(--fg-2);letter-spacing:0}
.wr-grid .v.s{font-size:16px;letter-spacing:-.01em;line-height:1.25}
.wr-grid .v-av{margin-top:auto}
.top-comp,.most-crew{display:flex;flex-direction:column;gap:14px;width:100%;text-align:left}
.most-crew{margin-top:10px}
.foot-links{display:flex;flex-direction:column;align-items:center;gap:4px}
/* live: passenger + driver */
.live.day{--void:#F3F4F7;--surface:#FFFFFF;--surface-2:#ECEEF3;--surface-3:#D9DDE6;--line:rgba(10,14,30,.12);--line-2:rgba(10,14,30,.22);--fg:#04050A;--fg-2:#363C4A;--fg-3:#555C6B;--ion:#2F4FD0;--ion-soft:rgba(47,79,208,.12);--flare:#9A5A00;--glass:rgba(255,255,255,.9);color-scheme:light;color:var(--fg);background:var(--void)}
.live.day canvas{display:none}
.live.day .live-meta .tile,.live.day .mission,.live.day .event,.live.day .dcard{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.live .mission,.live .event{background:rgba(11,12,16,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:16px}
.live .event{border-color:rgba(242,183,102,.45);animation:eventIn 520ms var(--spring)}
#lv-event:empty{display:none}
@keyframes eventIn{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.live-sub{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mode-seg > *{height:48px;font-size:15px}
.live .icon-btn{width:48px;height:48px}
.day-btn[aria-pressed="true"]{background:var(--fg);color:var(--void);border-color:var(--fg)}
.live-clock{font-size:15px;color:var(--fg-2)}
.live .live-meta .tile .t-num{font-size:26px}
.m-head{display:flex;align-items:center;gap:14px}
.m-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.m-title{font-size:19px;font-weight:600;letter-spacing:-.01em}
.m-desc{font-size:15px;color:var(--fg-2);line-height:1.5}
.m-sub{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.m-done{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-md);background:rgba(98,217,166,.10);border:1px solid rgba(98,217,166,.28);color:var(--signal);font-weight:500}
.live.day .m-done{color:#0B7A4E}
.counter-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.m-count{font-size:60px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.who-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;padding:12px 6px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:15px;font-weight:600;transition:transform var(--fast) var(--ease),border-color var(--fast)}
.who-btn:active{transform:scale(.93);border-color:var(--ion)}
.who-btn .pts{font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--fg-2)}
.pick-list{display:flex;flex-direction:column;gap:10px}
.pick-m{display:flex;align-items:center;gap:14px;padding:16px;min-height:80px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);text-align:left}
.pick-m .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pick-m .grow b{font-weight:600;font-size:16px}
.pick-m .grow span{font-size:14px;color:var(--fg-2);line-height:1.4}
.silent{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.silent .t-num{font-size:72px}
.driver-note{font-size:18px;color:var(--fg-2);font-weight:500}
.driver{display:flex;flex-direction:column;gap:12px}
.dcard{display:flex;flex-direction:column;gap:6px;padding:20px 22px;border-radius:var(--r-lg);background:rgba(11,12,16,.86);border:1px solid var(--line-2)}
.dcard .k{font-family:var(--font-mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.dcard .v{font-family:var(--font-display);font-weight:500;font-size:clamp(64px,20vw,104px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.dcard .v.m{font-size:clamp(28px,8vw,40px);letter-spacing:-.03em;line-height:1.1}
.dcard .u{font-size:17px;color:var(--fg-2)}
.d-crew{display:flex;flex-wrap:wrap;gap:12px 18px}
.d-crew > span{display:flex;align-items:center;gap:10px}
.d-crew b{font-size:20px;font-weight:600}
.driver-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.driver-actions .btn{height:68px;font-size:17px;padding:0 12px}

/* ---------- v0.3: avatars, profile, manage friend ---------- */
.av{background:#0D1017;overflow:hidden;position:relative}
.av > svg{width:100%;height:100%;display:block}
.av::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:none}
.tab .tab-ic .av{box-shadow:0 0 0 1.5px transparent;transition:box-shadow var(--fast)}
.tab[aria-current="page"] .tab-ic .av{box-shadow:0 0 0 1.5px var(--fg)}
.av-btn{position:relative;border-radius:50%}
.av-btn .av{box-shadow:0 0 0 1px var(--line-2),0 16px 44px rgba(124,156,255,.22)}
.av-btn .edit-pip{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--void);display:grid;place-items:center;box-shadow:0 0 0 3px var(--void);transition:transform var(--base) var(--spring)}
.av-btn:hover .edit-pip{transform:scale(1.08) rotate(-8deg)}
.av-stage{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:4px 0 6px}
.av-big{--s:128px;box-shadow:0 0 0 1px var(--line-2),0 18px 50px rgba(124,156,255,.25)}

.av-name{font-size:24px;min-height:1.2em}
.save-state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--signal);opacity:0;transform:translateY(4px);transition:opacity var(--base),transform var(--base) var(--ease)}
.save-state.on{opacity:1;transform:none}
.av-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:10px}
.av-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;min-height:44px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--fg-2);transition:border-color var(--fast),background var(--fast),transform var(--fast) var(--ease)}
.av-opt:active{transform:scale(.95)}
.av-opt[aria-checked="true"]{border-color:var(--ion);background:var(--ion-soft);color:var(--fg)}
.av-mini{--s:48px}
.sw-dot{display:block;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.av-opt[aria-checked="true"] .sw-dot{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--fg)}
.av-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px}
.manage-link{align-self:center;color:var(--fg-3);margin-top:-8px}
.btn-danger{background:rgba(255,107,107,.12);color:#FF9E9E;border:1px solid rgba(255,120,120,.32)}
.btn-danger:hover{background:rgba(255,107,107,.18)}
.ic-tile.danger{color:#FF9E9E;background:rgba(255,107,107,.10);border-color:rgba(255,120,120,.28)}
.row.danger b{color:#FF9E9E}
.confirm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:6px 0 0}

.confirm h2{font-size:22px;max-width:18ch;text-wrap:balance}
.confirm p{max-width:34ch}

/* ---------- v0.4: mission system ---------- */
.feat{color:var(--flare) !important}
.feat-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--flare);margin-left:6px;vertical-align:2px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.board{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:2px max(20px,env(safe-area-inset-left,0px)) 4px}
.board::-webkit-scrollbar{display:none}
.pl{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:var(--r-md);background:rgba(11,12,16,.84);border:1px solid var(--line-2);text-align:center;transition:transform var(--fast) var(--ease),border-color var(--base),box-shadow var(--base)}
.live.day .pl{background:var(--surface)}
.pl:active{transform:scale(.95)}
.pl.lead{border-color:rgba(242,183,102,.6);box-shadow:0 0 24px rgba(242,183,102,.14)}
.pl-av{position:relative;display:inline-block}
.cap-badge{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--void);display:grid;place-items:center;box-shadow:0 0 0 2px var(--void)}
.pl b{font-size:14.5px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.pl-pts{font-family:var(--font-display);font-size:24px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.pl-fx{font-family:var(--font-mono);font-size:11px;color:var(--ion);min-height:14px}
.pl-inv{display:flex;gap:6px}
.pu{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ion-soft);border:1px solid rgba(124,156,255,.4);color:var(--fg);animation:medalIn 500ms var(--spring) both}
.pu.empty{background:none;border:1px dashed var(--line-2);animation:none}
.ev-ic{width:48px;height:48px;flex:none}
.event.decision{border-color:rgba(124,156,255,.5)}
.cosmic .ev-ic{animation:wobble 1.8s var(--ease) infinite}
@keyframes wobble{50%{transform:rotate(-8deg) scale(1.06)}}
.ev-out{display:flex;flex-direction:column;gap:8px}
.ev-row{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;background:var(--surface-2);font-size:15px;animation:rise 420ms var(--ease) both}
.ev-row:nth-child(2){animation-delay:90ms}.ev-row:nth-child(3){animation-delay:180ms}.ev-row:nth-child(4){animation-delay:270ms}.ev-row:nth-child(5){animation-delay:360ms}
.ev-row b{flex:1;font-weight:600}
.ev-row > span:last-child{font-family:var(--font-mono);font-size:14px}
.ev-row.good > span:last-child{color:var(--signal)}
.ev-row.bad > span:last-child{color:#FF8A8A}
.ev-row.ok > span:last-child{color:var(--ion)}
.live.day .ev-row.good > span:last-child{color:#0B7A4E}
.live.day .ev-row.bad > span:last-child{color:#B42318}
.dec-opts{display:grid;gap:10px}
.dec{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:16px;font-weight:600;text-align:left;transition:transform var(--fast) var(--ease),border-color var(--fast)}
.dec .mono{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--ion-soft);color:var(--ion);font-size:14px}
.dec:active{transform:scale(.97);border-color:var(--ion)}
.dec-opts.big{margin-top:10px}
.dec-opts.big .dec{min-height:84px;font-size:20px}
.top-actions{display:flex;gap:8px}
/* transmissions */
.tx{position:fixed;inset:0;z-index:120;display:grid;place-items:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:radial-gradient(70% 50% at 50% 30%,rgba(124,156,255,.2),rgba(0,0,0,0) 70%),rgba(0,0,0,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:pageIn 300ms var(--ease)}
.tx.captain{background:radial-gradient(70% 50% at 50% 30%,rgba(242,183,102,.2),rgba(0,0,0,0) 70%),rgba(0,0,0,.94)}
.live.day .tx{background:rgba(243,244,247,.97)}
.tx-in{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.radar{position:relative;width:120px;height:120px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(124,156,255,.6);animation:radar 2.2s var(--ease) infinite}
.radar i:nth-child(2){animation-delay:.73s}.radar i:nth-child(3){animation-delay:1.46s}
@keyframes radar{from{transform:scale(.35);opacity:1}to{transform:scale(1.3);opacity:0}}
.radar .core{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ion-soft);border:1px solid rgba(124,156,255,.6);color:var(--fg);box-shadow:0 0 30px rgba(124,156,255,.35)}
.tx.captain .radar i{border-color:rgba(242,183,102,.65)}
.tx.captain .radar .core{background:rgba(242,183,102,.14);border-color:rgba(242,183,102,.6);box-shadow:0 0 30px rgba(242,183,102,.3)}
.tx-kind{color:var(--ion)}
.tx.captain .tx-kind,.tx.captain .tx-to{color:var(--flare)}
.tx-status{font-family:var(--font-mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.tx-status::after{content:"";display:inline-block;width:8px;height:14px;margin-left:8px;vertical-align:-2px;background:currentColor;animation:pulse 1s steps(2) infinite}
.wave{display:flex;align-items:center;gap:4px;height:36px}
.wave i{width:4px;height:100%;border-radius:4px;background:var(--ion);transform:scaleY(.2);animation:wave 900ms var(--ease) infinite alternate;animation-delay:var(--d)}
.tx.captain .wave i{background:var(--flare)}
.tx.open .wave i{animation-duration:420ms}
@keyframes wave{to{transform:scaleY(1)}}
.tx-body{display:none;flex-direction:column;align-items:center;gap:14px;width:100%}
.tx.open .tx-body{display:flex;animation:rise 520ms var(--ease) both}
.tx-to{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ion)}
.tx-msg{font-family:var(--font-display);font-weight:500;font-size:clamp(24px,7vw,32px);letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.tx-from{font-size:14px;color:var(--fg-2)}
.tx-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.verdicts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.verdicts .btn{padding:0 6px;font-size:14px;height:52px}
.tx-targets{display:flex;flex-wrap:wrap;gap:8px}
.tx-targets .chip{height:42px;padding:0 14px 0 9px;font-size:14px;cursor:pointer;gap:8px}
.tx-targets .chip[aria-pressed="true"]{background:var(--fg);color:var(--void);border-color:var(--fg)}
.tx-ideas{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tx-ideas .chip{height:auto;min-height:36px;padding:7px 12px;white-space:normal;text-align:left;line-height:1.35;cursor:pointer}

.field select{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--fg);font-family:inherit}
.elst{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2)}
.elst b{font-size:16px}.elst span{font-size:13px;color:var(--fg-2);line-height:1.4}
.elst.ok{border-color:var(--ion)}.elst.bad{border-color:var(--danger)}.elst.bad b{color:var(--danger)}
.elr{margin:6px 2px 0;font-size:13.5px;line-height:1.4}.elr.bad{color:var(--danger)}.elr.ok{color:var(--ion)}.elr.warn{color:var(--fg-2)}.elr span{color:var(--fg-2);font-size:12.5px}
.eldl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 2px 4px;font-size:13px}.eldl dt{color:var(--fg-3)}.eldl dd{margin:0;word-break:break-all}.eldl code{font:12px var(--font-mono)}
.eldiag{margin-top:12px}.eldiag summary{cursor:pointer;color:var(--fg-2);font-size:13px;padding:6px 0}
.eldiag pre{max-height:190px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font:11px/1.45 var(--font-mono);white-space:pre-wrap;word-break:break-word;color:var(--fg-2)}
.field.area{height:auto;align-items:flex-start;padding:14px 16px}
.field.area textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;font:inherit;font-size:16px;color:var(--fg);line-height:1.45}
.field.area textarea::placeholder{color:var(--fg-3)}
/* cosmic answers */
.ca-prompt{font-family:var(--font-display);font-weight:500;font-size:22px;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.pass{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:4px 0}
.pass b{font-size:18px;font-weight:600}
.ca-list{display:flex;flex-direction:column;gap:10px}
.ca-card{display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);text-align:left;font-size:16.5px;font-weight:500;line-height:1.4;transition:border-color var(--fast),transform var(--fast) var(--ease)}
.ca-card:active{transform:scale(.98)}
.ca-card .mono{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--ion-soft);color:var(--ion);font-size:13px}
.ca-card.chosen{border-color:var(--ion);background:var(--ion-soft)}
.ca-reveal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:4px 0;animation:medalIn 700ms var(--spring) both}
.ca-reveal .display{font-size:24px}
/* log, warp, start splash */
.mlog{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:52px 18px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;font-size:14px;line-height:1.4}
.lg + .lg{border-top:1px solid var(--line)}
.lg .mono{font-size:12px;color:var(--fg-3);padding-top:2px}
.lg svg{margin-top:2px;color:var(--fg-3)}
.warp{align-self:center;color:var(--fg-3);font-family:var(--font-mono);font-size:12px;letter-spacing:.04em}
.m-start{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px;animation:pageIn 300ms var(--ease)}
.m-start .medal-ic{width:104px;height:104px;margin:0 auto 6px;animation:medalIn 800ms var(--spring) both}
.m-start .display{font-size:clamp(34px,10vw,48px)}
.d-pts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.d-pt{display:flex;align-items:center;gap:12px}
.d-pt b{flex:1;font-size:20px;font-weight:600}
.d-pt > span:last-child{font-family:var(--font-display);font-size:30px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* recap: Spaceman, scores, Captain rating */
.spaceman-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 22px 26px;border-radius:var(--r-xl);border:1px solid rgba(242,183,102,.42);background:radial-gradient(80% 70% at 50% 0%,rgba(242,183,102,.22),rgba(0,0,0,0) 70%),radial-gradient(60% 50% at 50% 100%,rgba(124,156,255,.14),rgba(0,0,0,0) 70%),var(--surface)}
.sheet .spaceman-card{background:radial-gradient(80% 70% at 50% 0%,rgba(242,183,102,.2),rgba(0,0,0,0) 70%),var(--surface-2)}
.spaceman-card .burst{top:118px}
.sm-av{position:relative;display:inline-block;margin:8px 0 10px;animation:medalIn 900ms var(--spring) both}
.sm-av::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(242,183,102,.6);animation:halo 1.8s var(--ease) 400ms infinite}
.sm-av .av{box-shadow:0 0 0 3px rgba(242,183,102,.75),0 18px 50px rgba(242,183,102,.25)}
.sm-badge{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--flare);color:#1A1205;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.spaceman-card h2{font-size:28px;margin-top:8px}
.sm-chip{background:rgba(242,183,102,.18);border-color:rgba(242,183,102,.45)}
.score-row{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.list > .score-row + .score-row{border-top:1px solid var(--line)}
.score-row .n{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.score-row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-row .p{font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tag-cap{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:400;vertical-align:1px}
.rate{display:flex;flex-direction:column;gap:12px}
.sheet .rate{background:var(--surface-2)}
.rate-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.rate-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rate-avg{font-family:var(--font-display);font-size:30px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate-avg small{font-size:14px;color:var(--fg-2);letter-spacing:0}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.rate-row > span:first-child{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.rate-row > span:first-child svg{color:var(--fg-2)}
.stars{display:flex;margin-right:-8px}
.star{width:44px;height:44px;display:grid;place-items:center;color:var(--surface-3);transition:transform var(--fast) var(--spring),color var(--fast)}
.star.on{color:var(--flare)}
.star:active{transform:scale(.82)}
.star svg{fill:currentColor}
.verdict{font-size:14px;color:var(--fg-2)}
.cap-card{display:flex;flex-direction:column;gap:12px}
.cap-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cap-big{font-family:var(--font-display);font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.cap-big small{font-size:18px;color:var(--fg-2);letter-spacing:0}
.cap-metric{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;gap:12px;align-items:center;font-size:14px;color:var(--fg-2)}
.cap-metric > span:first-child{display:flex;gap:8px;align-items:center;min-width:0}
.cap-metric .mono{text-align:right;color:var(--fg)}
.bar.flare > i{background:linear-gradient(90deg,var(--flare),#F7D29C)}
.cap-mini{display:flex;align-items:center;gap:14px;background:var(--surface-2)}
.go-crew .pl-av .cap-badge{right:-4px;bottom:-2px}

/* ---------- v0.5: every player on their own phone ---------- */
.dev-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.dev-chip{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg-2)}

.dev-txt b{color:var(--fg);font-size:14px;font-weight:600}
.dev-txt small{font-size:12px}
.dev-conn{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3)}
.dev-conn i{width:7px;height:7px;border-radius:50%;background:var(--signal);opacity:.55}
.dev-conn i.me{opacity:1;box-shadow:0 0 0 3px rgba(98,217,166,.22)}
.dev-conn span{margin-left:6px}
.pl.mine{border-color:var(--ion)}
.pl.mine.lead{border-color:rgba(242,183,102,.7)}
.pu-dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2);margin:10px 2px}
.pu-dot.on{background:var(--fg-2);border-color:var(--fg-2)}
#lv-ch{display:flex;flex-direction:column;gap:16px}
.m-prog{font-size:12.5px;color:var(--fg-3);margin:0;letter-spacing:.02em}
.m-prog:empty{display:none}
.buzz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:150px;border-radius:var(--r-lg);background:radial-gradient(80% 90% at 50% 0%,rgba(124,156,255,.42),rgba(124,156,255,.08) 70%),var(--surface-2);border:1px solid rgba(124,156,255,.6);box-shadow:0 10px 40px rgba(124,156,255,.22);transition:transform var(--fast) var(--ease),box-shadow var(--fast)}
.buzz span{font-family:var(--font-display);font-size:44px;font-weight:500;letter-spacing:-.03em}
.buzz small{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);letter-spacing:.08em;text-transform:uppercase}
.buzz:active{transform:scale(.95);box-shadow:0 4px 18px rgba(124,156,255,.4)}
.waiting{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:15px;color:var(--fg-2);line-height:1.4}
