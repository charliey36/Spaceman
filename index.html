<script>
/* =========================================================================
   SPACEMAN v0.2 — "Friendship measured in miles travelled together"
   catalogues/  sample people, missions, awards, milestones, levels
   accounts/    localStorage users, session, guests + claim codes (swap for API)
   model/       friendship levels, milestones, streaks, recording journeys
   ui/          small render helpers returning HTML strings
   views/       home · crew · go · memories · you · brand
   live/        countdown → passenger mode / driver safe mode → recap
   FUTURE: markers are seams for real functionality.
   ========================================================================= */

/* ---------- catalogues ---------- */
const MOON = 238900, EARTH = 24901;
/* Spaceman avatars: one flat SVG astronaut head. 4 helmets × 4 visors × 4 suit accents × 3 faces = 192 looks. */
const AV = {
  st:{stealth:['Stealth',['#3D4454','#1E2230','#0F1218'],'#141821','#262B38'], arctic:['Arctic',['#F4F6FA','#C3CAD6','#8E97A8'],'#CDD3DD','#AAB2C0'], navy:['Navy',['#3E5079','#1C2742','#0E1426'],'#17213A','#2A3A5E'],
      olive:['Field',['#4D5C46','#263123','#121810'],'#1E281C','#33412F'], crimson:['Crimson',['#5E3842','#2F1A21','#170C10'],'#2A151B','#45252E'], chrome:['Chrome',['#E3E8F0','#7D8698','#2C313C'],'#3A404D','#5A6274']},
  h:{classic:'Classic', rounded:'Pilot', explorer:'Explorer', modern:'Tactical', dome:'Dome', racer:'Racer', crest:'Commander', halo:'Halo'},
  v:{cyan:['Cyan','#5FE1F2'], blue:['Blue','#7C9CFF'], purple:['Purple','#B39CFF'], white:['White','#E9EDF5'], amber:['Amber','#F2B766'], red:['Red','#FF6B6B'],
     green:['Green','#62D9A6'], pink:['Pink','#FF8AD8'], orange:['Orange','#FF9E5E'], teal:['Teal','#3FD0C0'], lime:['Lime','#C3F26B']},
  s:{cyan:['Cyan','#5FE1F2'], purple:['Purple','#B39CFF'], blue:['Blue','#6E8CFF'], silver:['Silver','#AEB6C4'], amber:['Amber','#F2B766'], green:['Green','#62D9A6'],
     red:['Red','#FF6B6B'], pink:['Pink','#FF8AD8'], white:['White','#E9EDF5'], lime:['Lime','#C3F26B']},
  a:{none:'None', headset:'Headset', antenna:'Antenna', lamp:'Head lamp', scarf:'Scarf', patch:'Mission patch', wings:'Pilot wings'},
  f:{eyes:'Eyes', smile:'Grin', neutral:'Scan line', wink:'Wink', happy:'Happy', stern:'Focused', dots:'Thinking', ko:'Dizzy'}
};
const AV_DEF = {st:'stealth', h:'classic', v:'blue', s:'cyan', a:'none', f:'eyes'};
const AV_KEYS = Object.fromEntries(Object.keys(AV).map(k => [k, Object.keys(AV[k])]));
function hashAv(seed){ const r = rng('av:' + seed), p = k => AV_KEYS[k][Math.floor(r()*AV_KEYS[k].length)]; return {h:p('h'), v:p('v'), s:p('s'), f:p('f'), a:r() < .5 ? 'none' : p('a'), st:r() < .6 ? 'stealth' : p('st')}; }
/* v1.1 avatars: matte black tactical suits, graphite helmets and dark mirrored visors.
   The face is never drawn. Only a glowing HUD mark shows through the visor, in the player's colour. */
function avatarSVG(c = {}){
  const h = AV.h[c.h] ? c.h : 'classic', vk = AV.v[c.v] ? c.v : 'blue', sk = AV.s[c.s] ? c.s : 'cyan', vis = AV.v[vk][1], acc = AV.s[sk][1];
  const st = AV.st[c.st] ? c.st : 'stealth', [, HG, SUIT, SEAM] = AV.st[st], ak = AV.a[c.a] ? c.a : 'none', light = st === 'arctic' || st === 'chrome';
  const id = `av-${h}-${vk}-${sk}-${st}`, RIM = light ? '#8E97A8' : '#3A4050';
  const shell = `fill="url(#${id}-h)" stroke="${RIM}" stroke-width=".9"`;
  const helmet = {
    classic:`<circle cx="32" cy="28" r="19" ${shell}/>`,
    rounded:`<rect x="11" y="10" width="42" height="37" rx="17" ${shell}/><path d="M18 14.5h28" stroke="${RIM}" stroke-width=".8" stroke-linecap="round"/>`,
    explorer:`<line x1="40" y1="12" x2="44" y2="4.5" stroke="${RIM}" stroke-width="1.8" stroke-linecap="round"/><circle cx="44.3" cy="4.2" r="1.9" fill="${acc}"/><rect x="9.5" y="22" width="6.5" height="13" rx="2" fill="#1A1E28" stroke="${RIM}" stroke-width=".8"/><rect x="48" y="22" width="6.5" height="13" rx="2" fill="#1A1E28" stroke="${RIM}" stroke-width=".8"/><rect x="11" y="27" width="3.5" height="1.6" rx=".8" fill="${acc}"/><circle cx="32" cy="29" r="18" ${shell}/>`,
    modern:`<path d="M13.5 31C13.5 17 21.5 9 32 9s18.5 8 18.5 22v7.5c0 5.5-3.8 8.5-9.2 8.5H22.7c-5.4 0-9.2-3-9.2-8.5z" ${shell}/><path d="M32 9.3v6.2" stroke="${RIM}" stroke-width="1.2"/><rect x="29.6" y="10.8" width="4.8" height="1.6" rx=".8" fill="${acc}"/>`,
    dome:`<circle cx="32" cy="27.5" r="21" ${shell}/><circle cx="32" cy="27.5" r="19.2" fill="none" stroke="${vis}" stroke-opacity=".22" stroke-width="1.2"/><path d="M19 15.5q6-5.5 13-5.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>`,
    racer:`<circle cx="32" cy="28" r="19" ${shell}/><path d="M28.6 9.3h6.8v11.5h-6.8z" fill="${acc}" opacity=".9"/><path d="M27 9.6h1.2v11.2H27zM35.8 9.6H37v11.2h-1.2z" fill="${acc}" opacity=".45"/>`,
    crest:`<path d="M32 2.8l3.6 8.4h-7.2z" fill="${acc}"/><path d="M13.5 31C13.5 17 21.5 9 32 9s18.5 8 18.5 22v7.5c0 5.5-3.8 8.5-9.2 8.5H22.7c-5.4 0-9.2-3-9.2-8.5z" ${shell}/><path d="M16 26.5l-2.4-6M48 26.5l2.4-6" stroke="${acc}" stroke-width="1.6" stroke-linecap="round"/>`,
    halo:`<ellipse cx="32" cy="6.6" rx="11" ry="2.6" fill="none" stroke="${acc}" stroke-width="1.7"/><ellipse cx="32" cy="6.6" rx="11" ry="2.6" fill="none" stroke="${acc}" stroke-opacity=".3" stroke-width="4"/><circle cx="32" cy="28" r="19" ${shell}/>`
  }[h];
  const [vx, vy, vw, vh] = {classic:[17,19.5,30,16.5], rounded:[15.5,19,33,17], explorer:[18.5,21,27,15.5], modern:[16.5,21,31,14], dome:[15,18.5,34,18], racer:[14.5,21,35,13.5], crest:[16.5,21,31,14], halo:[17,19.5,30,16.5]}[h];
  const cx = vx + vw/2, cy = vy + vh/2;
  const ln = d => `<path d="${d}" fill="none" stroke="${vis}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
  const hud = c.f === 'eyes' ? [cx - 5, cx + 5].map(x => `<rect x="${x - 2.1}" y="${cy - 1}" width="4.2" height="2" rx="1" fill="${vis}"/>`).join('')
    : c.f === 'smile' ? ln(`M${cx - 5.5} ${cy - .6}q5.5 4.4 11 0`)
    : c.f === 'wink' ? `<rect x="${cx - 7.1}" y="${cy - 1}" width="4.2" height="2" rx="1" fill="${vis}"/>` + ln(`M${cx + 2.8} ${cy + .6}q2.2-2.6 4.4 0`)
    : c.f === 'happy' ? ln(`M${cx - 7.2} ${cy + .9}q2.2-3 4.4 0`) + ln(`M${cx + 2.8} ${cy + .9}q2.2-3 4.4 0`)
    : c.f === 'stern' ? ln(`M${cx - 7.2} ${cy - 1}l4.4 1.6`) + ln(`M${cx + 7.2} ${cy - 1}l-4.4 1.6`)
    : c.f === 'dots' ? [-5, 0, 5].map(d => `<circle cx="${cx + d}" cy="${cy}" r="1.25" fill="${vis}"/>`).join('')
    : c.f === 'ko' ? [cx - 5, cx + 5].map(x => ln(`M${x - 1.8} ${cy - 1.8}l3.6 3.6M${x + 1.8} ${cy - 1.8}l-3.6 3.6`)).join('')
    : ln(`M${cx - 7} ${cy}h14`);
  const acs = {none:'',
    headset:`<rect x="9.8" y="23.5" width="5.4" height="10.5" rx="2.2" fill="#1A1E28" stroke="${RIM}" stroke-width=".8"/><path d="M12.6 34v3.2q0 4.6 6 5.2h4.2" fill="none" stroke="${RIM}" stroke-width="1.5" stroke-linecap="round"/><circle cx="23.8" cy="42.4" r="1.7" fill="${acc}"/>`,
    antenna:`<path d="M21.5 12.6L17.4 3.6" stroke="${RIM}" stroke-width="1.6" stroke-linecap="round"/><circle cx="17.2" cy="3.4" r="2" fill="${acc}"/><circle cx="17.2" cy="3.4" r="3.6" fill="${acc}" opacity=".22"/>`,
    lamp:`<rect x="28" y="${h === 'dome' ? 5.6 : 8.6}" width="8" height="3.8" rx="1.3" fill="#1A1E28" stroke="${RIM}" stroke-width=".7"/><rect x="29.6" y="${h === 'dome' ? 6.5 : 9.5}" width="4.8" height="2" rx=".9" fill="#FFF4C2"/><circle cx="32" cy="${h === 'dome' ? 7.5 : 10.5}" r="5" fill="#FFF4C2" opacity=".14"/>`,
    scarf:`<path d="M19.6 45.6q12.4 5.6 24.8 0l-.8 4.2q-11.6 4.6-23.2 0z" fill="${acc}"/><path d="M37.6 49.6l3.2 9.2-4.2.6-1.4-8.8z" fill="${acc}" opacity=".85"/>`,
    patch:`<circle cx="21.8" cy="56.2" r="3.8" fill="#1C202B" stroke="${acc}" stroke-width="1.1"/><path d="M21.8 53.9l.8 1.6 1.7.2-1.3 1.2.4 1.7-1.6-.9-1.6.9.4-1.7-1.3-1.2 1.7-.2z" fill="${acc}"/>`,
    wings:`<path d="M32 55.6l-8.6-2.8 2.4 4zM32 55.6l8.6-2.8-2.4 4z" fill="${acc}"/><circle cx="32" cy="55.8" r="1.5" fill="#fff"/>`
  }[ak];
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><defs>`
    + `<linearGradient id="${id}-h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${HG[0]}"/><stop offset=".55" stop-color="${HG[1]}"/><stop offset="1" stop-color="${HG[2]}"/></linearGradient>`
    + `<linearGradient id="${id}-v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${vis}" stop-opacity=".42"/><stop offset=".45" stop-color="#0A0D14"/><stop offset="1" stop-color="#030408"/></linearGradient>`
    + `<radialGradient id="${id}-g" cx=".5" cy="1" r=".75"><stop offset="0" stop-color="${acc}" stop-opacity=".32"/><stop offset="1" stop-color="${acc}" stop-opacity="0"/></radialGradient></defs>`
    + `<rect width="64" height="64" fill="#07090E"/><rect width="64" height="64" fill="url(#${id}-g)"/>`
    + `<path d="M6 64c1.6-11.6 11.2-17.4 26-17.4S56.4 52.4 58 64z" fill="${SUIT}"/><path d="M19 64l3.5-12.5M45 64l-3.5-12.5" stroke="${SEAM}" stroke-width="1"/>`
    + `<path d="M11.5 59.5l7.5-5.2" stroke="${acc}" stroke-width="2" stroke-linecap="round"/><rect x="40.5" y="55" width="7" height="3.6" rx="1" fill="${acc}" opacity=".9"/>`
    + `<ellipse cx="32" cy="47.2" rx="12.5" ry="3.3" fill="#1C202B" stroke="${RIM}" stroke-width=".7"/>`
    + (ak === 'scarf' || ak === 'patch' || ak === 'wings' ? acs : '')
    + helmet
    + `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="${vh/2}" fill="url(#${id}-v)" stroke="${vis}" stroke-opacity=".55" stroke-width=".9"/>`
    + `<g opacity=".35" transform="translate(0 .3)">${hud.replace(/stroke-width="1.7"/g, 'stroke-width="3.6"').replace(/height="2"/g, 'height="3.4"')}</g>${hud}`
    + `<path d="M${vx + 4.5} ${vy + 3.6}q3-2 7.5-1.7" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>`
    + (ak === 'headset' || ak === 'antenna' || ak === 'lamp' ? acs : '') + `</svg>`;
}
/* Spaceman: the same suit, a gold mirrored visor and one red scanning eye. Instantly recognisable at 24 px. */

/* Friendship levels: miles together is the only metric. L1 10 · L2 50 · L3 100 · L4 250 · L5 500, then gaps grow 6% a level. */
const FL = (() => { const t = [0,10,50,100,250,500]; let inc = 150; while (t.length < 80){ t.push(Math.round((t[t.length-1] + inc)/10)*10); inc *= 1.06; } return t; })();
const LEVEL_NAMES = [[0,'Just met'],[1,'Passengers'],[5,'Road buddies'],[10,'Co-pilots'],[15,'Ride or die'],[20,'Same orbit'],[30,'Basically family']];
const levelOf = mi => { let l = 0; while (l + 1 < FL.length && mi >= FL[l+1]) l++; return l; };
const levelName = l => LEVEL_NAMES.filter(([n]) => l >= n).pop()[1];
function lvInfo(mi){ const l = levelOf(mi), lo = FL[l], hi = FL[l+1] ?? lo; return {l, name:levelName(l), lo, hi, toNext:Math.max(0, Math.ceil(hi - mi)), pct: hi > lo ? (mi - lo)/(hi - lo)*100 : 100}; }

function chart(m){
  const W=340, H=170, L=34, R=W-4, T=18, B=134, mx = Math.max(...m.mi, 50);
  const steps = []; for (const p of [1,10,100,1000,10000]) for (const k of [1,1.5,2,2.5,3,4,5,6,8]) steps.push(k*p);
  const step = steps.find(v => v*3 >= mx) || 10000, max = step*3, y = v => B - (v/max)*(B - T), bw = (R - L)/12;
  const top = Math.max(...m.mi), peak = top > 0 ? m.mi.indexOf(top) : -1;
  let g = '';
  [0, step, step*2, step*3].forEach(v => { g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--fg-3)" font-family="Geist Mono, monospace">${fmt(v)}</text>`; });
  const bars = m.mi.map((v,i) => { const x = L + i*bw + bw*.2, w = bw*.6, t = y(v), now = i === 11, pk = i === peak;
    return `<rect x="${x}" y="${t}" width="${w}" height="${B - t}" rx="3" fill="${pk ? 'url(#g-ion)' : now ? 'var(--surface-3)' : 'var(--fg-3)'}" fill-opacity="${pk || now ? 1 : .55}"${now ? ' stroke="var(--fg-3)" stroke-dasharray="2 2"' : ''}><title>${m.full[i]}: ${fmt(v)} mi</title></rect>

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Miles per month, last 12 months.${peak >= 0 ? ` Peak ${m.full[peak]} at ${fmt(top)} miles.` : ''}">${g}${bars}</svg>`;
}

/* ---------- starfield ---------- */
class Starfield {
  constructor(canvas, opts={}){
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.speed = opts.speed ?? .15; this.n = opts.n ?? 140; this.stars = [];
    this.resize(); for (let i = 0; i < this.n; i++) this.stars.push(this.mk(true));
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(canvas);
    this.loop = this.loop.bind(this); reduce ? this.draw() : requestAnimationFrame(this.loop);
  }
  mk(any){ return {x:(Math.random()-.5)*2, y:(Math.random()-.5)*2, z: any ? Math.random()*1 + .05 : 1.05, s:Math.random()}; }
  resize(){ const d = Math.min(devicePixelRatio || 1, 2), r = this.c.getBoundingClientRect(); this.w = r.width; this.h = r.height; this.c.width = r.width*d; this.c.height = r.height*d; this.ctx.setTransform(d,0,0,d,0,0); }
  draw(){
    const {ctx, w, h} = this; ctx.clearRect(0,0,w,h); const cx = w*.62, cy = h*.38, k = Math.max(w,h)*.5;
    for (const st of this.stars){
      const px = cx + st.x/st.z*k*.5, py = cy + st.y/st.z*k*.5;
      const a = Math.min(1, (1.05 - st.z)*1.3)*(.35 + st.s*.65), r = (1.1 - st.z)*1.3 + .2;
      if (this.speed > 1){ const pz = st.z + this.speed*.004, qx = cx + st.x/pz*k*.5, qy = cy + st.y/pz*k*.5;
        ctx.strokeStyle = `rgba(214,224,255,${a})`; ctx.lineWidth = r; ctx.beginPath(); ctx.moveTo(qx,qy); ctx.lineTo(px,py); ctx.stroke(); }
      else { ctx.fillStyle = `rgba(214,224,255,${a})`; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill(); }
    }
  }
  loop(){
    if (!this.c.isConnected){ this.ro.disconnect(); return; }
    for (const st of this.stars){ st.z -= .0009*this.speed*4; if (st.z < .04) Object.assign(st, this.mk(false)); }
    this.draw(); requestAnimationFrame(this.loop);
  }
}

  const r = location.hash.slice(1), key = ALIAS[r] || r, name = ROUTES[key] ? key : 'home', y = scrollY;
  view.innerHTML = ROUTES[name]();
  if (anim){ [...view.children].forEach((el,i) => el.style.setProperty('--i', Math.min(i,6))); view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); }
  else view.classList.remove('enter');
  document.querySelectorAll('[data-tab]').forEach(t => TAB[name] === t.dataset.tab ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'));
  document.querySelectorAll('[data-sec]').forEach(t => name === t.dataset.sec ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'));
  document.title = name === 'home' ? 'Spaceman' : `${TITLES[name]} · Spaceman`;
  const yt = document.querySelector('[data-tab="you"] .tab-ic'); if (yt) yt.innerHTML = av(ME.id, 26);
  const hc = view.querySelector('[data-stars] canvas'); if (hc) new Starfield(hc, {speed:.25, n:110});
  scrollTo(0, anim ? 0 : y);
}
const refresh = () => render(false);
const navTo = h => { if (location.hash === h) render(); else location.hash = h; };
document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = ic(el.dataset.ic, 22));

const sheet = $('#sheet'), live = $('#live');
let lastFocus = null;
function openSheet(html){
  if (sheet.hidden) lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><button class="sheet-x" data-close aria-label="Close">${ic('x',18)}</button><div class="sheet-body">${html}</div></div>`;
  const wasOpen = !sheet.hidden;
  sheet.hidden = false; document.body.style.overflow = 'hidden';
  if (wasOpen) sheet.classList.add('open'); else requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  bindDrag(); setTimeout(() => $('.sheet-x', sheet)?.focus({preventScroll:true}), 50);
}
function closeSheet(){
  if (sheet.hidden) return; sheet.classList.remove('open');
  document.body.style.overflow = (!live.hidden || !$('#auth').hidden) ? 'hidden' : '';
  setTimeout(() => { if (sheet.classList.contains('open')) return; sheet.hidden = true; sheet.innerHTML = ''; lastFocus?.focus?.({preventScroll:true}); }, 380);
  if (DB.session && live.hidden && (location.hash === '#go' || location.hash === '#crew' || location.hash === '#home' || location.hash === '')) refresh();
}
function bindDrag(){
  const g = $('.grab', sheet), s = $('.sheet', sheet); let y0 = null, dy = 0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; s.style.transition = 'none'; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); s.style.transform = `translateY(${dy}px)`; });
  g.addEventListener('pointerup', () => { s.style.transition = ''; s.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; dy = 0; });
}
let toastT;
/* One notification at a time, in order, without repeats. Nothing stacks on top of something else. */
const toastQ = []; let toastOn = false, toastNow = '';
function toast(msg){ msg = String(msg); if (msg === toastNow || toastQ.includes(msg)) return; toastQ.push(msg); if (toastQ.length > 3) toastQ.splice(0, toastQ.length - 3); if (!toastOn) nextToast(); }
function nextToast(){ const t = $('#toast'), msg = toastQ.shift(); if (!msg){ toastOn = false; toastNow = ''; return; }
  toastOn = true; toastNow = msg; t.innerHTML = `<span class="ok">${ic('check',13,2.6)}</span>${esc(msg)}`; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove('show'); setTimeout(nextToast, 280); }, 2300); }
function copyText(id){
  const el = $('#' + id); if (!el) return;
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it from here'); };
  try { navigator.clipboard.writeText(el.textContent.trim()).then(() => toast('Copied'), sel); } catch { sel(); }
}
function unlockHTML(o){
  return `<div class="unlock">${sparks(14)}<span class="medal-ic">${ic(o.icon,42)}</span>
    <span class="eyebrow ion">${o.eyebrow}</span><h2 class="display" style="font-size:28px">${o.title}</h2><p class="muted" style="max-width:30ch">${o.line}</p>
    ${o.chip ? `<span class="chip mono">${o.chip}</span>` : ''}${o.extra || ''}</div>`;
}

function notesFor(){
  const n = [], near = nearestLevelUp(), st = streakOf(JOURNEYS);
  if (near) n.push(['users', `${PEOPLE[near.f.id].name} is ${plural(near.i.toNext,'mile')} from Level ${near.i.l + 1} with you.`, 'Now']);
  cur().guests.filter(g => g.mi > 0).forEach(g => n.push(['gift', `${g.name} has ${plural(g.mi,'mile')} waiting. Send them an invite.`, 'Today']));
  if (st.n) n.push(['flare', `${st.n}-week streak. ${st.thisWeek ? 'This week’s done.' : 'Drive before Sunday to keep it.'}`, 'Today']);
  if (!n.length) n.push(['sparkle', `Welcome aboard, ${ME.name}. Your first journey starts the count.`, 'Now']);
  return n;
}

/* ==========================================================================
   Mission engine. Pure logic, no DOM, so the same code can run:
   - on the Captain's phone as the mission host (today: in this tab),
   - in a Node balance simulation (docs/BALANCE.md),
   - FUTURE: on a server or host device behind a realtime transport.
   Devices never change state directly. They send intents with act(S, {type, by, ...});
   the host applies them and every device renders the same shared state from its own seat.

   Roles: Captain (driving), Co-Pilot (a passenger who taps things in for the Captain), Crew.
   An intent with as:'captain' from the Co-Pilot counts as the Captain's. The Captain can still tap directly.

   Pacing: one major thing at a time. Challenges, cosmic events, decisions, transmissions and power-up
   drops all go through one queue, with at least RULES.gap REAL seconds between them.
   ========================================================================== */

  triviaRight:3,                           // every correct answer. No speed element: answers stay hidden until everyone locks in

    if (k === 'discount'){ S.hj.target = Math.max(S.hj.pool, Math.ceil(S.hj.target/2)); text = `Rescue discount. The rescue fund for ${nm(S, S.hj.who)} is now ${S.hj.target}. Get them back.`; out.push({id:S.hj.who, kind:'Rescue fund', text:'Half price', d:`${Math.min(S.hj.pool, S.hj.target)} / ${S.hj.target}`, c:'ok'}); if (S.hj.pool >= S.hj.target) rescueDone(S); }
    if (k === 'barrage'){ let got = 0; [...S.crew].sort((a, b) => S.pts[b] - S.pts[a]).slice(0, 2).forEach(id => { const r = loss(S, id, PT.barrage, 'event'); const o = {id, kind:'Spaceman barrage', text:'', d:lossText(r), c:lossClass(r)}; const t = smTake(S, r, `barrage on ${nm(S, id)}`); if (t) o.sm = t; got += t; out.push(o); }); text = 'Spaceman opens fire on the top two. Shields help.'; roast(S, 'smwinning'); }
    if (k === 'robin'){ const r = loss(S, lead, PT.robin, 'event'); if (r.lost) gain(S, low, r.lost, 'event'); out.push({id:lead, kind:'Fuel leak', text:'', d:lossText(r), c:lossClass(r)}, {id:low, kind:'Picked it up', text:'', d:r.lost ? `+${r.lost}` : '0', c:r.lost ? 'good' : 'zero'}); text = `The leader’s fuel tank springs a leak. Whoever’s last drives right through it.`; }
    if (k === 'pickpocket'){ const thief = ranked.find(id => S.inv[id].length < slotsOf(S, id)), from = thief && [...S.crew].filter(id => id !== thief && S.inv[id].length).sort((a, b) => S.pts[b] - S.pts[a])[0], low = thief;
      if (from && thief){ const it = S.inv[from].splice(Math.floor(R()*S.inv[from].length), 1)[0]; S.inv[low].push(it); out.push({id:low, kind:'Pickpocket', text:`Stole from ${nm(S, from)}`, d:'+1 power-up', c:'good'}, {id:from, kind:'Robbed', text:'', d:'−1 power-up', c:'bad'}); text = `${nm(S, low)} goes pickpocketing and lifts a power-up from ${nm(S, from)}.`; }
      else { S.crew.forEach(id => { const g = givePU(S, id); if (g) out.push({id, kind:'Supply drop', text:'', d:'Power-up', c:'ok'}); }); text = 'Nobody worth robbing. A supply drop instead.'; } }
    if (k === 'raid'){ let n2 = 0; S.crew.filter(id => S.inv[id].length).forEach(id => { if (S.fx[id].shield){ S.fx[id].shield = false; out.push({id, kind:'Raid', text:'', d:'Shield held', c:'ok'}); return; } S.inv[id].splice(Math.floor(R()*S.inv[id].length), 1); n2++; out.push({id, kind:'Raided', text:'', d:'−1 power-up', c:'bad'}); });
      if (n2) smGain(S, n2*PT.raid, 'raided the crew’s power-ups'); text = 'Spaceman raids the lockers. One power-up from everyone holding one. Shields stop it.'; }
    S.ev = {type:'milestone', k, n, out, text, until:S.rt + RULES.evShow + 2, id:++S.txId, atlas:S.evSay ? atlasEv(S, 'milestone', null, {n}) : ''}; S.evSay = null; say(S, {t:'sfx', k:'milestone'}); say(S, {t:'haptic'}); bump(S);
  }
  function runStory(S, k){

    S.ev = {type:'story', k, out, until:S.rt + RULES.evShow, id:++S.txId}; log(S, st.ic, `${st.name}. ${out.map(o => `${nm(S, o.id)}: ${o.d}`).join(', ')}`); say(S, {t:'sfx', k:'supply'}); say(S, {t:'haptic'});
  }

  /* ---- transmissions ---- */
  function openTx(S, tx){
    tx.id = ++S.txId; tx.phase = tx.kind === 'captain' ? 'ask' : 'play'; tx.at = S.min; tx.reacts = {}; tx.said = {};
    tx.atRt = S.rt; if (tx.kind === 'captain') tx.botAnswerAt = S.min + rr(RULES.answerBy); else { const words = [tx.pre, tx.text, tx.post].filter(Boolean).join(' ').split(/\s+/).length; tx.dur = Math.round(Math.min(22, Math.max(8, 5.5 + words*.42))*10)/10; tx.until = S.rt + tx.dur; }   /* long enough to hear it, then it dismisses itself */
    S.tx = tx;
    log(S, 'signal', tx.kind === 'roast' ? `Spaceman: ${tx.text}` : tx.kind === 'captain' ? `Captain question: ${tx.text}` : tx.kind === 'talk' ? `Discussion: ${tx.text}` : tx.kind === 'chatter' ? `Atlas: ${tx.text}` : `Transmission: “${tx.text}”`);
    say(S, {t:'tx', id:tx.id});
  }
  function closeTx(S){
    const tx = S.tx; if (!tx) return;
    if (tx.kind === 'captain'){ const t = {}; Object.values(tx.reacts).forEach(v => { t[v] = (t[v] || 0) + 1; }); const top = Object.entries(t).sort((a, b) => b[1] - a[1])[0];
      if (top) log(S, 'signal', `Crew verdict on the Captain’s answer: ${top[0]}`); }
    S.tx = null; endMajor(S);
  }

  /* ---- intents from devices ---- */
  function act(S, a){
    const by = a.by; if (!S.crew.includes(by)) return null;
    const viaCo = a.as === 'captain' && by === S.copilot && by !== S.captain;   /* the Co-Pilot tapping in what the Captain said */
    const pid = viaCo ? S.captain : by, capOK = pid === S.captain, ch = S.ch;
    switch (a.type){
      case 'answer': if (ch && ch.kind === 'answers' && ch.phase === 'write' && pid !== S.captain && !ch.answers[pid] && a.text){ ch.answers[pid] = String(a.text).slice(0, 90); bump(S); if (Object.keys(ch.answers).length >= pass(S).length) toPick(S); } break;
      case 'pick': if (ch && ch.phase === 'pick' && capOK && ch.order[a.idx]){ ch.fav = ch.order[a.idx]; ch.phase = 'guess'; ch.viaCo = viaCo; ch.said = {}; ch.bot[S.captain] = S.min + rr(RULES.answers.guessBy); bump(S); } break;
      case 'guess': if (ch && ch.phase === 'guess' && capOK && pass(S).includes(a.who)){
        const ok = a.who === ch.fav; chGain(S, ch.fav, PT.answerAuthor, true); if (ok) chGain(S, S.captain, PT.captainGuess);
        ch.reveal = {by:ch.fav, guess:a.who, ok, text:ch.answers[ch.fav]};
        finishCh(S, `“${String(ch.answers[ch.fav]).replace(/^[“"]+|[”"]+$/g, '')}” by ${nm(S, ch.fav)} (+${PT.answerAuthor}). Captain guessed ${ok ? `right (+${PT.captainGuess})` : 'wrong'}`); } break;
      case 'tq': if (ch && ch.kind === 'trivia' && ch.phase === 'q' && !ch.ans[pid] && a.opt >= 0 && a.opt < 4){
        ch.ans[pid] = {opt:+a.opt, viaCo}; bump(S);
        if (Object.keys(ch.ans).length >= S.crew.length) settleQ(S); } break;
      case 'est': { const v = Math.round(Number(a.value)*100)/100;
        if (ch && ch.kind === 'estimate' && ch.phase === 'est' && !(pid in ch.guesses) && Number.isFinite(v) && v >= 0){ ch.guesses[pid] = v; if (viaCo) ch.viaCo = true; bump(S); if (Object.keys(ch.guesses).length >= S.crew.length) settleEst(S); } } break;
      case 'spot-found': if (ch && ch.kind === 'spot' && ch.phase === 'look' && S.crew.includes(a.who)){ const v = chGain(S, a.who, PT.spot, true); ch.winner = a.who; ch.reportedBy = by;
        finishCh(S, `${nm(S, a.who)} spotted the ${ch.target.n.toLowerCase()} first. +${v}`); } break;
      case 'spot-new': if (ch && ch.kind === 'spot' && ch.phase === 'look' && S.min >= ch.rerollAt){ log(S, 'swap', `No ${ch.target.n.toLowerCase()} in sight. New target requested`); newTarget(S, ch, ch.target); } break;
      case 'vote': if (ch && ch.kind === 'vote' && ch.phase === 'vote' && !ch.votes[pid] && a.who !== pid && S.crew.includes(a.who)){ ch.votes[pid] = a.who; bump(S); if (Object.keys(ch.votes).length >= S.crew.length) settleVote(S); } break;
      case 'silent-start': if (ch && ch.kind === 'silent' && ch.phase === 'idle'){ ch.phase = 'run'; ch.runAt = S.min; ch.crackAt = S.min + rr(RULES.silent.crack); ch.cracker = pick(S.crew); S.nextAt = Math.max(S.nextAt, S.rt + RULES.gap); bump(S); } break;
      case 'talked': if (S.crew.includes(a.who)) crack(S, a.who); break;
      case 'choose': if (MISSIONS[a.id] && MISSIONS[a.id].w && (!ch || ch.phase === 'done')){ S.pick = a.id; bump(S); } break;
      case 'skip': if (ch && ch.phase !== 'done'){ log(S, 'x', `${MISSIONS[ch.id].name} skipped`); S.ch = null; setOpts(S); endMajor(S); } break;
      case 'decide': if (capOK) decide(S, a.choice, viaCo); break;
      case 'use': return usePU(S, pid, a.idx, a.target, viaCo);
      case 'music-set': if (by === a.who || !a.who) setMusic(S, by, a.p); break;                    /* a player shares, refreshes or stops sharing their own profile */
      case 'song': songIn(S, by, a.track); break;                                                   /* what this phone is playing; ignored unless they share */
      case 'music-quiet': if (by === S.captain){ S.musicQuiet = !!a.on; bump(S); } break;
      case 'tx-send': if (a.text){ S.txq.push({at:S.min + (a.when === 'rand' ? 3 + R()*9 : +a.when), to:a.to, text:String(a.text).slice(0, 140), from:by}); bump(S); } break;
      case 'answered': if (S.tx && S.tx.kind === 'captain' && S.tx.phase === 'ask' && capOK){ S.tx.phase = 'react'; S.tx.viaCo = viaCo; S.tx.until = S.rt + RULES.reactFor; pass(S).forEach(p => { S.tx['bot_' + p] = S.min + rr(RULES.reactBy); }); if (PT.priority) gain(S, S.captain, PT.priority, 'captain'); bump(S); } break;
      case 'react': if (S.tx && S.tx.phase === 'react' && pid !== S.captain && !S.tx.reacts[pid]){ S.tx.reacts[pid] = a.v; bump(S); if (Object.keys(S.tx.reacts).length >= pass(S).length) closeTx(S); } break;
      case 'roll': if (S.ev && S.ev.type === 'promo' && S.ev.who === by) roll(S); break;
      case 'intel-ans': { const e = S.ev; if (e && e.type === 'briefing' && S.intelQs[pid] && S.intelQs[pid].includes(+a.qi) && !(a.qi in S.intel[pid]) && a.opt >= 0 && a.opt < 4){
        S.intel[pid][+a.qi] = +a.opt; bump(S);
        if (S.crew.every(id => Object.keys(S.intel[id]).length >= 3)){ e.until = Math.min(e.until, S.rt + 2.5); e.allIn = true; } } } break;
      case 'pick-a': if (ch && (ch.kind === 'intel' || ch.kind === 'whatnext') && ch.phase === 'guess' && a.opt >= 0 && a.opt < 4){
        if (ch.kind === 'whatnext' && pid === ch.who && ch.a === null){ ch.a = +a.opt; bump(S); }
        else if (ch.voters.includes(pid) && !(pid in ch.picks)){ ch.picks[pid] = +a.opt; bump(S); }
        if (ch.voters.every(id => id in ch.picks) && (ch.kind === 'intel' || ch.a !== null)) settlePicks(S); } break;
      case 'tf': if (ch && ch.kind === 'bluff' && ch.phase === 'tf' && ch.voters.includes(pid) && !(pid in ch.picks) && typeof a.v === 'boolean'){ ch.picks[pid] = a.v; bump(S); if (ch.voters.every(id => id in ch.picks)) settleBluff(S); } break;
      case 'fix': { const v = Math.round(Number(a.value)*100)/100; if (ch && ch.kind === 'corrective' && ch.phase === 'fix' && ch.crewAns === null && Number.isFinite(v) && v >= 0){ ch.crewAns = v; ch.by = pid; bump(S); settleFix(S); } } break;
      case 'bet': if (ch && ch.kind === 'risk' && ch.phase === 'bet' && !ch.bets[pid] && ['higher','lower'].includes(a.hl) && PT.stakes[a.stake]){
        ch.bets[pid] = {hl:a.hl, stake:a.stake}; bump(S); if (S.crew.every(id => ch.bets[id])) settleRisk(S); } break;
      case 'box-ready': if (ch && ch.kind === 'blackbox' && ch.phase === 'read' && pid !== S.captain){ ch.ready[pid] = true; bump(S);
        if (pass(S).every(id => ch.ready[id])){ ch.phase = 'talk'; ch.until = S.rt + RULES.blackbox.talk; bump(S); } } break;
      case 'box-talked': if (ch && ch.kind === 'blackbox' && ch.phase === 'talk'){ ch.phase = 'vote'; ch.until = S.rt + RULES.blackbox.vote; bump(S); } break;
      case 'box-vote': if (ch && ch.kind === 'blackbox' && ch.phase === 'vote' && !ch.votes[pid] && a.who !== pid && a.who !== S.captain && S.crew.includes(a.who)){
        ch.votes[pid] = a.who; bump(S); if (S.crew.every(id => ch.votes[id])) settleBox(S); } break;
      case 'struggle-ans': { const e = S.ev; if (e && e.type === 'struggle' && e.phase === 'q' && (e.who === by || e.rival === by) && !(by in e.ans) && a.opt >= 0 && a.opt < 4){
        e.ans[by] = +a.opt; bump(S); if (e.who in e.ans && e.rival in e.ans) settleStruggle(S); } } break;
      case 'duel-ans': { const e = S.ev; if (e && e.type === 'duel' && e.phase === 'q' && (e.a === by || e.b === by) && !(by in e.ans) && a.opt >= 0 && a.opt < 4){
        e.ans[by] = +a.opt; e.at2[by] = S.rt; bump(S); if (e.a in e.ans && e.b in e.ans) settleDuel(S); } } break;
      case 'bribe': if (S.ev && S.ev.type === 'bribe' && S.ev.who === by) settleBribe(S, !!a.yes); break;
      case 'emote': { const E = ['😂','😱','👏','🔥']; if (!E.includes(a.e) || S.rt - (S.lastReact[by] || -9) < 1.2) break; S.lastReact[by] = S.rt;
        S.reacts.push({by, e:a.e, rt:S.rt, id:++S.reactId}); if (S.reacts.length > 30) S.reacts.shift();
        if (S.ch && S.ch.phase === 'done'){ const r = S.ch.reacts ||= {}; r[a.e] = (r[a.e] || 0) + 1; if (a.e === '😂' && r[a.e] === 3) mem(S, 'funny', null, {game:MISSIONS[S.ch.id].name}); }
        bump(S); } break;
      case 'avemote': { if (!AV_EMOTES.includes(a.e) || S.rt - (S.aeLast[by] || -9) < 1.2) break; S.aeLast[by] = S.rt;
        S.ae[by] = {e:a.e, n:++S.aeN, until:S.rt + 4.5}; bump(S); } break;
      case 'final': if (!S.final && !S.q.some(x => x.type === 'final')) enqueue(S, 'final'); break;
      case 'qroll': { const e = S.ev; if (e && e.type === 'qualify' && e.phase === 'roll' && e.pool.includes(by) && !(by in e.rolls)){ e.rolls[by] = ri(1, 6); say(S, {t:'sfx', k:'dice'}); bump(S); if (e.pool.every(p => p in e.rolls)) settleQualify(S); } } break;
      case 'hj-ransom': if (S.hj && S.hj.who === by){ const cost = bail(S); if (S.pts[by] >= cost){ S.pts[by] -= cost; S.src[by].event -= cost; smGain(S, cost, `${nm(S, by)} paid a ransom`); hjFree(S, 'ransom'); } } break;
      case 'hj-donate': { const h = S.hj, n = Math.round(+a.n);
        if (h && h.who !== by && [2, 5, 10].includes(n) && S.pts[by] >= n){

          log(S, 'shield', `${nm(S, by)} put ${n} towards freeing ${nm(S, h.who)} (${Math.min(h.pool, h.target)} / ${h.target})`); say(S, {t:'sfx', k:'select'}); bump(S);
          if (h.pool >= h.target) rescueDone(S);
        } } break;
      case 'hj-swap': if (S.hj && S.hj.who !== by && !S.hj.swapped){ const was = S.hj.who; gain(S, by, PT.hjHero, 'event'); S.st[by].hero++; S.hj.who = by; S.hj.swapped = true; S.hj.hero = by;
        log(S, 'swap', `${nm(S, by)} swapped places with ${nm(S, was)}. ${nm(S, by)} is now Spaceman’s captive (+${PT.hjHero} for bravery)`); say(S, {t:'toast', text:`${nm(S, by)} took ${nm(S, was)}’s place as Spaceman’s captive`}); say(S, {t:'sfx', k:'reveal'}); bump(S); } break;
      case 'warp': S.min += a.mins; S.mi += a.mins*58/60; break;
    }
    return null;
  }

  const AV_EMOTES = ['😀','😂','🤣','😡','🫡','💀','😭','👀','🚀','☄️'];
  /* ---- bots: simulated players acting from their own devices ---- */
  /* A simulated Captain says its choice out loud. The Co-Pilot taps it in (a bot after a short delay, or you).
     owner.said[key] is what the Co-Pilot's phone shows as "Captain said". */
  function capSays(S, B, owner, key, intent, text){
    if (!S.copilot) return act(S, {...intent, by:S.captain});
    if (!owner.said[key]){ owner.said[key] = {intent, text, at:S.rt, by:S.rt + rr(RULES.proxy)}; bump(S); }
    const s = owner.said[key];
    if (B.has(S.copilot) && S.rt >= s.by && !s.done){ s.done = true; act(S, {...intent, by:S.copilot, as:'captain'}); }
  }
  function botAnswer(S){ const ch = S.ch, used = Object.values(ch.answers); const opt = ch.ideas.filter(x => !used.includes(x)); return opt.length ? pick(opt) : pick(ch.ideas) + '!'; }
  function botGuess(q, spread = RULES.estimate.spread){ const g = q.a*Math.exp(gauss()*spread); return q.year ? Math.round(q.a + gauss()*6) : g >= 100 ? Math.round(g/10)*10 : g >= 10 ? Math.round(g) : Math.round(g*10)/10; }
  function bots(S){
    const B = new Set(S.bots), ch = S.ch, capBot = B.has(S.captain);
    S.crew.forEach(id => { if (B.has(id) && S.rt >= (S.aeNext[id] ??= S.rt + rr([18, 70]))){ S.aeNext[id] = S.rt + rr([40, 120]); act(S, {type:'avemote', by:id, e:pick(AV_EMOTES)}); } });   /* simulated phones fidget too */
    const dueMin = id => ch && ch.bot[id] !== undefined && S.min >= ch.bot[id];
    if (ch){
      if (ch.phase === 'write') pass(S).forEach(p => { if (B.has(p) && dueMin(p) && !ch.answers[p]) act(S, {type:'answer', by:p, text:botAnswer(S)}); });
      if (ch.phase === 'pick' && capBot && dueMin(S.captain)){ const i = ch.botPick ?? (ch.botPick = Math.floor(R()*ch.order.length)); capSays(S, B, ch, 'pick', {type:'pick', idx:i}, `I like ${'ABCDEF'[i]}`); }
      if (ch.phase === 'guess' && capBot && dueMin(S.captain)){ const w = ch.botGuess || (ch.botGuess = pick(pass(S))); capSays(S, B, ch, 'guess', {type:'guess', who:w}, `I reckon ${nm(S, w)} wrote it`); }
      if (ch.phase === 'q'){
        S.crew.forEach(p => { const b = ch.bot[p]; if (!b || ch.ans[p] || S.rt < b.t) return;
          if (p === S.captain){ if (capBot) capSays(S, B, ch, 'q' + ch.round, {type:'tq', opt:b.opt}, `It’s ${'ABCD'[b.opt]}, ${ch.cur.o[b.opt]}`); return; }
          if (!B.has(p)) return;
          if (p === S.copilot && !ch.ans[S.captain] && ch.said['q' + ch.round] && !ch.said['q' + ch.round].done) return;   /* busy tapping in the Captain's answer */
          act(S, {type:'tq', by:p, opt:b.opt}); });
      }
      if (ch.phase === 'est') S.crew.forEach(p => { if (!dueMin(p) || p in ch.guesses) return; const g = ch.botG?.[p] ?? ((ch.botG ||= {})[p] = botGuess(ch.q));
        if (p === S.captain){ if (capBot) capSays(S, B, ch, 'est', {type:'est', value:g}, `I’m going with ${g.toLocaleString('en-GB')}`); }
        else if (B.has(p)) act(S, {type:'est', by:p, value:g}); });
      if (ch.phase === 'vote') S.crew.forEach(p => { if (!dueMin(p) || ch.votes[p]) return; const w = ch.botV?.[p] || ((ch.botV ||= {})[p] = pick(S.crew.filter(x => x !== p)));
        if (p === S.captain){ if (capBot) capSays(S, B, ch, 'vote', {type:'vote', who:w}, `My vote’s for ${nm(S, w)}`); }
        else if (B.has(p)) act(S, {type:'vote', by:p, who:w}); });
      const since = ch.t0 !== undefined ? S.rt - ch.t0 : -1, others = ch.voters ? ch.voters.filter(x => x !== S.captain) : [];
      const capTurn = () => (ch.voters || []).filter(x => x !== S.captain).every(x => (ch.kind === 'risk' ? ch.bets[x] : ch.picks && x in ch.picks)) || since > (ch.window || 40)*.6;   /* the Captain answers out loud last */
      if (ch.phase === 'guess' && ch.voters && since >= 0){
        if (ch.kind === 'whatnext' && ch.a === null && B.has(ch.who) && since >= ch.bot[ch.who].by) act(S, {type:'pick-a', by:ch.who, opt:ch.bot[ch.who].opt});
        ch.voters.forEach(p => { const b = ch.bot[p]; if (!b || p in ch.picks || since < b.by) return;
          if (p === S.captain){ if (capBot && capTurn()) capSays(S, B, ch, 'pick', {type:'pick-a', opt:b.opt}, `I reckon ${'ABCD'[b.opt]}, ${ch.o[b.opt]}`); return; }
          if (B.has(p)) act(S, {type:'pick-a', by:p, opt:b.opt}); });
      }
      if (ch.phase === 'tf' && since >= 0) S.crew.forEach(p => { const b = ch.bot[p]; if (!b || p in ch.picks || since < b.by) return;
        if (p === S.captain){ if (capBot && capTurn()) capSays(S, B, ch, 'tf' + ch.round, {type:'tf', v:b.v}, b.v ? 'True' : 'False'); return; }

/* Re-rendering never touches what a player is doing on THEIR phone.
   Shared state arrives as HTML; morph() patches the live DOM to match it. Text fields, focus, caret, selection, scroll and
   JS-driven animation state belong to this phone, so they are never replaced. A new game, round or phase (fk) starts fresh. */
const KEEP_CLS = ['go','revealed','on','open'], KEEP_ATTR = ['data-go'];
function morphAttrs(a, b){
  for (const {name, value} of [...b.attributes]){
    if (name === 'class'){ const keep = KEEP_CLS.filter(c => a.classList.contains(c) && !b.classList.contains(c)); const v = keep.length ? `${value} ${keep.join(' ')}` : value; if (a.getAttribute('class') !== v) a.setAttribute('class', v); }
    else if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  }
  for (const {name} of [...a.attributes]) if (!b.hasAttribute(name) && name !== 'class' && !KEEP_ATTR.includes(name)) a.removeAttribute(name);
}
function morphKids(a, b){
  const old = [...a.childNodes], nw = [...b.childNodes], n = Math.max(old.length, nw.length);
  for (let i = 0; i < n; i++){
    const o = old[i], w = nw[i];
    if (!w){ o.remove(); continue; }
    if (!o){ a.appendChild(document.importNode(w, true)); continue; }
    if (o.nodeType !== w.nodeType || o.nodeName !== w.nodeName || (o.id || '') !== (w.id || '')){ a.replaceChild(document.importNode(w, true), o); continue; }
    if (o.nodeType !== 1){ if (o.nodeValue !== w.nodeValue) o.nodeValue = w.nodeValue; continue; }
    morphAttrs(o, w);
    if (o.nodeName === 'TEXTAREA' || o.nodeName === 'INPUT' || o.nodeName === 'SELECT') continue;   /* never touch a field the player is using */
    morphKids(o, w);
  }
}
/* What a seat is in the middle of (typed text, a chosen stake, a dismissed card, a "who was it?" picker) belongs to that seat.
   It survives every remote update, and in the prototype it also survives switching phones and back. */
const loc = () => { const all = LJ.locs || (LJ.locs = {}); return all[LJ.viewer] || (all[LJ.viewer] = {}); };
const draftKey = id => `${LJ.viewer}|${LJ.fk['lv-ch'] || ''}|${id}`;
function restoreDrafts(){ if (!LJ || !LJ.drafts) return; document.querySelectorAll('#lv-ch input[id], #lv-ch textarea[id]').forEach(el => { const v = LJ.drafts[draftKey(el.id)]; if (v !== undefined && !el.value) el.value = v; }); }
document.addEventListener('input', e => { const el = e.target; if (LJ && el && el.id && el.closest && el.closest('#lv-ch')) (LJ.drafts || (LJ.drafts = {}))[draftKey(el.id)] = el.value; });
function setHTML(id, html, fk){
  if (LJ.cache[id] === html) return; const el = document.getElementById(id); if (!el) return;
  const same = fk === undefined || LJ.fk[id] === fk;
  if (same && el.firstChild){ const t = document.createElement('template'); t.innerHTML = html; morphKids(el, t.content); }
  else el.innerHTML = html;
  LJ.cache[id] = html; if (fk !== undefined) LJ.fk[id] = fk;
  if (id === 'lv-ch') restoreDrafts();
}
function paint(){
  if (!LJ) return; const S = LJ.S; LJ.lastSeq = S.seq;
  setHTML('lv-me', meHTML()); setHTML('lv-vs', vsHTML()); setHTML('lv-board', boardHTML()); setHTML('lv-ch', stageHTML(), S.ch ? `${S.ch.uid}|${S.ch.round || 0}|${S.ch.phase}` : (S.ev ? `e${S.ev.id}` : '')); setHTML('lv-tray', trayHTML()); setHTML('lv-music', musicBarHTML()); spinReels();
  /* Spaceman's verdict after each game, and the What Happens Next? endings read out for the Captain on the Co-Pilot's phone */
  if (S.ch && S.ch.phase === 'done' && S.ch.smSay && LJ.verdict !== S.ch.uid && !S.tx){ LJ.verdict = S.ch.uid; if (LJ.voice) Voice.speak(`${S.ch.smSay} Over.`, {role:'sm', mood:'smug'}); }
  if (S.ev && S.ev.sm && LJ.smSaid !== S.ev.id && !S.tx){ const e = S.ev; LJ.smSaid = e.id; LJ.atlasSaid = `${e.id}:${e.atlas}`;
    if (LJ.voice) Voice.speak(`${e.sm} Over.`, {role:'sm', mood:'smug', then:() => { if (LJ && LJ.voice && LJ.S.ev === e && e.atlas) Voice.speak(`${e.atlas} Over.`, {role:'atlas', mood:LJ.S.atlas.mood}); }}); }
  if (S.ev && S.ev.atlas && LJ.atlasSaid !== `${S.ev.id}:${S.ev.atlas}` && !S.tx && !(S.ev.type === 'bribe' && S.ev.who === LJ.viewer)){ LJ.atlasSaid = `${S.ev.id}:${S.ev.atlas}`; if (LJ.voice) Voice.speak(`${S.ev.atlas} Over.`, {role:'atlas', mood:S.atlas.mood}); }
  if (S.reacts.length && S.reactId > (LJ.emoteSeen ?? S.reactId - S.reacts.length)){ const from = LJ.emoteSeen ?? 0; S.reacts.filter(r => r.id > from).slice(-6).forEach(floatEmote); LJ.emoteSeen = S.reactId; }
  if (S.ch && S.ch.kind === 'whatnext' && S.ch.phase === 'guess' && LJ.readNext !== S.ch.uid && !S.tx && !(S.captain in S.ch.picks) && S.ch.voters.includes(S.captain)
      && S.ch.voters.filter(x => x !== S.captain).every(x => x in S.ch.picks) && (S.copilot ? LJ.viewer === S.copilot : isCap())){ LJ.readNext = S.ch.uid; if (LJ.voice) Voice.speak(readNext(S.ch), {role:'atlas', mood:'curious'}); }
  if (S.ch && S.ch.phase === 'intro' && LJ.announced !== S.ch.uid && !S.tx){ LJ.announced = S.ch.uid; const M = MISSIONS[S.ch.id]; if (LJ.voice) Voice.speak(`${S.ch.atlas || `Next up. ${M.name}.`} ${M.how}`, {role:'atlas', mood:S.atlas.mood}); }
  txOverlay(); progress();
}

function boardHTML(){

const PIPS = {1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[30,26],[70,26],[30,50],[70,50],[30,74],[70,74]]};

/* ---------- Spotify (Phase 12) ----------
   Authorization Code + PKCE (no client secret ever ships in this file). Scopes are the minimum for the features: top items, recently played, playback state.
   Tokens live under their own localStorage key and are wiped on disconnect. What the account keeps is names, artwork links and play hours only.
   MUSIC_DERIVED switches the lines that compute things from listening (counts, percentages, awards). docs/SPOTIFY.md explains why it is a switch. */
const MUSIC_DERIVED = true;
/* Spotify app settings. This is a static site with no build step, so this block plays the part of environment variables.
   clientId:     the Client ID from developer.spotify.com/dashboard (not secret; PKCE needs no secret). Can also be pasted in the app.
   redirectUris: the exact Redirect URI per host. Each one must be registered in the Dashboard character for character:
                 scheme, host, path, letter case and trailing slash all count.
   Hosts not listed use this page's own address in a fixed form: no index.html, always a trailing slash (see Spotify.redirect). */
const SPOTIFY_CONFIG = {
  clientId:'',
  redirectUris:{
    'charliey36.github.io':'https://charliey36.github.io/Spaceman/'      /* production: GitHub Pages */
  }
};
const SP_KEY = 'spaceman.spotify.v1', SP_LOG = 'spaceman.spotify.log';
/* Sign-in log: console + the last 40 steps on this device (shown in the Spotify sheet). Never holds tokens, codes or the verifier. */
function spLog(stage, info = {}){
  try { console.info('[Spotify]', stage, info); const l = JSON.parse(localStorage.getItem(SP_LOG) || '[]'); l.push({at:new Date().toISOString().slice(11, 19), stage, ...info}); localStorage.setItem(SP_LOG, JSON.stringify(l.slice(-40))); } catch {}
}
const spLogRead = () => { try { return JSON.parse(localStorage.getItem(SP_LOG) || '[]'); } catch { return []; } };
const SP_SCOPES = 'user-top-read user-read-recently-played user-read-currently-playing user-read-playback-state';
const spLogo = (n = 16) => `<svg class="sp-logo" width="${n}" height="${n}" viewBox="0 0 24 24" role="img" aria-label="Spotify"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M5.6 9.3c4.4-1.3 9.3-1 13 1.2M6.3 12.9c3.7-1 7.5-.7 10.6 1.1M7 16.3c3-.8 5.8-.5 8.3.9" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg>`;
const safeUrl = u => /^https:\/\/([\w-]+\.)*(spotify\.com|scdn\.co|spotifycdn\.com)\//.test(u || '') ? u : '';
const SpStore = {
  read(){ try { return JSON.parse(localStorage.getItem(SP_KEY)) || {}; } catch { return {}; } },
  write(o){ try { localStorage.setItem(SP_KEY, JSON.stringify(o)); } catch {} }
};
const rand64 = n => { const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~', a = crypto.getRandomValues(new Uint8Array(n)); return Array.from(a, x => cs[x % cs.length]).join(''); };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const imgOf = (imgs, min) => { const l = (imgs || []).filter(i => i && i.url).sort((a, b) => (a.width || 0) - (b.width || 0)); return (l.find(i => (i.width || 0) >= min) || l[l.length - 1] || {}).url || ''; };
const agoText = t => { if (!t) return 'never'; const m = Math.round((Date.now() - t)/60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

const Spotify = {
  now:null, busyUntil:0, syncing:false,
  st: () => cur().spotify,
  connected(){ const s = cur() && cur().spotify; return !!(s && s.on); },
  sharing(){ return this.connected() && !!S.settings.spotifyShare && !!this.st().profile; },
  clientId(){ return String(SpStore.read().clientId || window.SPACEMAN_SPOTIFY_CLIENT_ID || SPOTIFY_CONFIG.clientId || '').trim(); },
  setClient(v){ const o = SpStore.read(); o.clientId = String(v).replace(/[^\w-]/g, '').slice(0, 64); SpStore.write(o); },
  setRedirect(v){ const o = SpStore.read(); v = String(v || '').trim(); if (v) o.redirectUri = v; else delete o.redirectUri; SpStore.write(o); },
  /* ONE redirect URI, the same on every visit: Spotify compares it with the Dashboard exactly. Older builds used this page's raw address,
     so /Spaceman/, /spaceman/, /Spaceman/index.html and /Spaceman each sent a different value and only one could ever match. */
  redirect(){
    const o = SpStore.read(); if (o.redirectUri) return o.redirectUri;
    const cfg = window.SPACEMAN_SPOTIFY_REDIRECT_URI || SPOTIFY_CONFIG.redirectUris[location.hostname]; if (cfg) return cfg;
    return location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');
  },
  uriIssue(uri = this.redirect()){
    let u; try { u = new URL(uri); } catch { return 'The Redirect URI isn’t a valid address.'; }
    if (u.hostname === 'localhost') return 'Spotify doesn’t accept “localhost”. Use http://127.0.0.1:PORT/ instead, and open this page from that address.';
    if (u.protocol !== 'https:' && !(u.protocol === 'http:' && (u.hostname === '127.0.0.1' || u.hostname === '[::1]'))) return location.protocol === 'file:' ? 'This page is open as a file. Spotify needs it served from https:// or http://127.0.0.1. Run “python3 -m http.server 8000 --bind 127.0.0.1” in the project folder, then open http://127.0.0.1:8000/.' : 'Spotify only accepts https:// Redirect URIs, or http://127.0.0.1 for local testing.';
    if (u.origin !== location.origin) return `The Redirect URI is on ${u.origin}, but this page is on ${location.origin}. Spotify would send you to the other site, so sign-in can’t finish here.`;
    if (u.hash) return 'A Redirect URI can’t contain #.';
    return '';
  },
  engine(p = this.st().profile){ return p ? {genres:p.genres || [], artists:(p.artists || []).map(a => a.n), tracks:(p.tracks || []).map(t => ({n:t.n, a:t.a})), recent:p.recent || []} : null; },
  /* ---- sign-in: Authorization Code with PKCE ---- */
  async begin(share = true){
    const cid = this.clientId(), redirect = this.redirect(), issue = this.uriIssue(redirect);
    if (!cid){ spLog('blocked', {why:'no client id'}); return spotifySheet('setup'); }
    if (issue){ spLog('blocked', {why:issue, redirect_uri:redirect}); return spotifySheet('setup'); }
    if (LJ) return toast('Connect Spotify after this mission. Signing in leaves the page.');
    if (!(window.isSecureContext && window.crypto && crypto.subtle)){ spLog('blocked', {why:'no secure context'}); return this.failed('insecure'); }
    const o = SpStore.read(); if (o.pending) spLog('replacing earlier attempt', {age_s:Math.round((Date.now() - o.pending.at)/1000)});
    const verifier = rand64(64), challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))), state = rand64(24), dialog = !!o.retry;
    o.pending = {state, verifier, uid:cur().id, share, at:Date.now(), redirect, clientId:cid, ret:location.hash || '#you'}; delete o.retry; SpStore.write(o);
    const q = {client_id:cid, response_type:'code', redirect_uri:redirect, code_challenge_method:'S256', code_challenge:challenge, state, scope:SP_SCOPES};
    if (dialog) q.show_dialog = 'true';
    try { sessionStorage.setItem('spaceman.spotify.leaving', state); } catch {}                                   /* after a failure or disconnect, let them pick the account again */
    spLog('authorize', {redirect_uri:redirect, client_id:cid.slice(0, 6) + '…', show_dialog:dialog});

  },
  /* Spotify sends people back with ?code&state or ?error&state. When the Redirect URI doesn't match, Spotify shows its own error page instead and
     never sends them back: the next time Spaceman opens with an unfinished attempt, that attempt is cleared and explained. */
  async callback(){

    spLog('callback', {code:q.has('code') ? `received (${q.get('code').length} chars)` : 'none', error:q.get('error') || '', state:!pen ? 'no attempt on this device' : pen.state === q.get('state') ? 'matches' : 'does not match', redirect_uri:pen && pen.redirect});

    if (!r || r.bad) return this.failed('exchange', pen, r ? [r.error, r.desc].filter(Boolean).join(': ') : 'no response from Spotify');
    const u = cur(); u.spotify = {...u.spotify, on:true, demo:false, status:'ok', err:''}; this.lastFail = null;
    if (pen.share){ S.settings.spotifyShare = true; u.settings = {...S.settings}; }

  },
  checkReturn(){

    const o = SpStore.read(), pen = o.pending; let mine = false; try { mine = !!pen && sessionStorage.getItem('spaceman.spotify.leaving') === pen.state; sessionStorage.removeItem('spaceman.spotify.leaving'); } catch {}

  failed(reason, pen, detail = ''){

  },

    ${tiles.length ? `<div class="sp-tiles">${tiles.join('')}</div>` : ''}
    ${aw.length ? `<div class="list" style="margin-top:10px">${aw.map(a => `<div class="award"><span class="trophy">${ic('music',20)}</span><span class="txt"><b>🎵 ${esc(a.title)}</b><span>${esc(a.line)}</span></span></div>`).join('')}</div>` : ''}
    ${(m.moments || []).length ? `<div class="card" style="margin-top:10px;padding:8px 16px"><span class="eyebrow">Music moments</span>${m.moments.map(x => `<div class="sp-mom"><span class="mono">min ${x.t}</span><span>${esc(x.text)}</span></div>`).join('')}</div>` : ''}
    <p class="sp-foot" style="margin-top:8px">Music data from Spotify</p></section>`;
}

/* ---- connect / manage sheet ---- */
const SP_FAIL = {
  'no-return':'Spotify didn’t send you back to Spaceman. If Spotify showed “redirect_uri: Not matching configuration” or “Invalid redirect URI”, the Redirect URI below isn’t registered in your Spotify app exactly as shown. If you just pressed back, you can simply try again.',
  cancelled:'You cancelled the Spotify sign-in, so nothing was connected.',
  spotify:'Spotify stopped the sign-in.',
  'no-pending':'This sign-in started in a different browser, or it was already used. Start again from here.',
  state:'This sign-in didn’t match the one Spaceman started, so it was ignored for your safety.',
  expired:'The sign-in took too long and expired.',
  account:'The sign-in was started by a different Spaceman account. Sign in as that account, or start again here.',
  exchange:'Spotify sent you back, but wouldn’t swap the sign-in code for access.',
  insecure:'This browser won’t do secure sign-in on this page. Open it from https:// or http://127.0.0.1.'
};
function spHint(f){
  const d = String(f.detail || '').toLowerCase();
  if (f.reason === 'no-return' || d.includes('redirect')) return 'Fix: in developer.spotify.com/dashboard → your app → Settings → Redirect URIs, add the address above exactly (including https, letter case and the final /), then Save.';
  if (d.includes('invalid_client')) return 'Fix: the Client ID doesn’t match a Spotify app. Copy it again from the Dashboard.';
  if (d.includes('invalid_grant')) return 'The sign-in code was already used or expired. Try again.';
  if (d.includes('unauthorized_client') || d.includes('user not registered')) return 'Fix: in Development Mode, add this Spotify account under User Management in the Dashboard.';
  return '';
}
function spotifySheet(view){
  Spotify.view = view;
  const u = cur(), s = u.spotify, cid = Spotify.clientId(), redirect = Spotify.redirect(), issue = Spotify.uriIssue(redirect), share = !!u.settings.spotifyShare, f = Spotify.lastFail;
  const uriBox = `<span class="sp-sub">Redirect URI this app sends</span><div class="sp-code" id="sp-redirect">${esc(redirect)}</div><button class="btn btn-secondary btn-block" data-copy="sp-redirect">${ic('copy',16)}Copy Redirect URI</button>`;
  const log = spLogRead().slice(-12).reverse();
  const logBox = log.length ? `<details class="card" style="padding:12px 16px"><summary class="small muted">Connection log</summary><div class="sp-code" style="margin-top:10px;white-space:pre-wrap">${log.map(e => esc(`${e.at} ${e.stage}${Object.keys(e).filter(k => k !== 'at' && k !== 'stage').map(k => ` · ${k}: ${e[k]}`).join('')}`)).join('\n')}</div></details>` : '';
  const switchRow = `<div class="row"><span class="grow"><b>🎵 Share Spotify Data</b><span>${share ? 'On: your crew sees your music' : 'Off: hidden, and Spaceman stays quiet about it'}</span></span><button class="switch" role="switch" aria-checked="${share}" aria-label="Share Spotify Data" data-toggle="spotifyShare"></button></div>`;
  let title = 'Spotify', body;
  if (view === 'fail' && f){
    title = 'Spotify connection failed';
    body = `<div class="card stack-v" style="gap:10px;border-color:var(--flare)"><b>${esc(SP_FAIL[f.reason] || 'Something went wrong.')}</b>${f.detail ? `<span class="small muted">Spotify said: ${esc(f.detail)}</span>` : ''}</div>
      <span class="sp-sub">Redirect URI that was used</span><div class="sp-code" id="sp-redirect">${esc(f.redirect)}</div><button class="btn btn-secondary btn-block" data-copy="sp-redirect">${ic('copy',16)}Copy Redirect URI</button>
      ${spHint(f) ? `<p class="small muted">${esc(spHint(f))}</p>` : ''}
      <div class="stack-v"><button class="btn btn-primary btn-lg btn-block" data-action="sp-connect">${spLogo(20)}Try again</button>
      <button class="btn btn-secondary btn-lg btn-block" data-action="sp-setup">${ic('sliders',18)}Check Spotify app settings</button>
      <button class="btn btn-ghost btn-lg btn-block" data-action="sp-reset">Reset Spotify connection</button></div>${logBox}`;
  } else if (view === 'setup' || (!s.on && (!cid || issue))){
    title = 'Spotify app settings';
    body = `<div class="card stack-v" style="gap:10px">
        <p class="small muted">1. In developer.spotify.com/dashboard, open your app → Settings → Redirect URIs and add the address below <b>exactly</b>. Tick Web API and save. 2. Paste the Client ID. There’s no secret: sign-in uses PKCE.</p>
        ${uriBox}
        <label class="field" for="sp-client">${ic('sliders',18)}<input id="sp-client" value="${esc(cid)}" placeholder="Spotify Client ID" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
        <details><summary class="small muted">Use a different Redirect URI</summary><p class="small muted" style="margin:8px 0">Only if your Dashboard already lists another address on this site. Leave empty for the one above.</p>
          <label class="field" for="sp-redirect-in">${ic('signal',18)}<input id="sp-redirect-in" value="${esc(SpStore.read().redirectUri || '')}" placeholder="${esc(redirect)}" autocomplete="off" spellcheck="false" autocapitalize="off"></label></details>
        ${issue ? `<p class="small" style="color:var(--flare)">${esc(issue)}</p>` : ''}
        <button class="btn btn-primary btn-block" data-action="sp-connect">${spLogo(20)}Connect Spotify</button>
        <button class="btn btn-ghost btn-block" data-action="sp-forget">Clear app settings</button></div>
      ${s.on ? '' : `<button class="btn btn-ghost btn-lg btn-block" data-action="sp-demo">${ic('sparkle',18)}Try the demo (no Spotify account)</button>`}${logBox}`;
  } else if (s.on){
    const st = s.status === 'ok' ? 'Spotify Connected' : s.status === 'expired' ? 'Reconnect needed' : s.status === 'forbidden' ? 'Access blocked' : 'Spotify unavailable';
    body = `<div class="list"><div class="row">${spLogo(30)}<span class="grow"><b>${st}</b><span>${s.demo ? 'Demo account with simulated music' : `Last updated ${agoText(s.at)}`}</span></span></div>${switchRow}
      <div class="row"><span class="grow"><b>Simulated crew music</b><span>Prototype: friends in this app get demo profiles so you can try crew features</span></span><button class="switch" role="switch" aria-checked="${s.demoCrew !== false}" aria-label="Simulated crew music" data-sp-demo-crew data-action="sp-democrew"></button></div></div>
      ${s.status === 'forbidden' ? '<p class="small muted">Spotify apps in Development Mode only work for accounts the developer has added (up to five). Add this account in the Spotify developer dashboard under User Management.</p>' : ''}
      ${s.status === 'expired' ? '<p class="small muted">Your Spotify sign-in ended (it was revoked, or the app settings changed). Reconnect to carry on.</p>' : ''}
      <div class="stack-v">${s.demo ? '' : `<button class="btn btn-secondary btn-lg btn-block" data-action="sp-refresh">${ic('swap',18)}Refresh my music</button>`}
      ${!s.demo && s.status !== 'ok' ? `<button class="btn btn-primary btn-lg btn-block" data-action="sp-connect">Reconnect Spotify</button>` : ''}
      <button class="btn btn-danger btn-lg btn-block" data-action="sp-disconnect">${ic('trash',18)}Disconnect and delete my Spotify data</button></div>
      <p class="small muted">Disconnecting removes the saved tokens and everything we stored from Spotify on this device. To also revoke access on Spotify’s side, remove Spaceman at spotify.com/account/apps.</p>
      ${s.demo ? '' : `<button class="btn btn-ghost btn-block" data-action="sp-setup">Spotify app settings</button>${logBox}`}`;
  } else {
    body = `<ul class="sp-steps"><li>Reads your top artists, top tracks and recently played, plus what’s playing now.</li><li>Stores artist and track names, artwork links and the hour of recent plays. Nothing else.</li><li>Never changes your playlists or your playback, and never posts anywhere.</li><li>Shared with your crew only while Share Spotify Data is on.</li></ul>
      <div class="stack-v"><button class="btn btn-primary btn-lg btn-block" data-action="sp-connect">${spLogo(20)}Connect Spotify</button>
      <button class="btn btn-ghost btn-lg btn-block" data-action="sp-demo">${ic('sparkle',18)}Try the demo (no Spotify account)</button>
      <button class="btn btn-ghost btn-block" data-action="sp-setup">Spotify app settings</button></div>`;
  }
  openSheet(`<div data-sp-sheet class="stack-v" style="gap:16px"><div class="sheet-title"><span class="eyebrow ion">Music</span><h2 class="display" style="font-size:24px">${title}</h2></div>${body}
    <p class="sp-foot">${spLogo(14)}Music data from Spotify. Spotify is a trademark of Spotify AB; Spaceman isn’t affiliated with it.</p></div>`);
}
Object.assign(ACTIONS, {
  'sp-open': () => spotifySheet(),
  'sp-setup': () => spotifySheet('setup'),
  'sp-connect': () => Spotify.begin(true),
  'sp-reset': () => { Spotify.reset(); spotifySheet(); toast('Spotify connection reset. You can connect again.'); },
  'sp-forget': () => { Spotify.forgetApp(); spotifySheet('setup'); toast('Spotify app settings cleared'); },
  'sp-demo': () => { Spotify.demo(); spotifySheet(); toast('Demo music is on'); },
  'sp-refresh': async () => { toast('Refreshing your music'); await Spotify.sync(true); },
  'sp-disconnect': () => { Spotify.disconnect(); closeSheet(); toast('Spotify disconnected and your music data deleted'); },
  'sp-democrew': (t) => { const s = cur().spotify, on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); s.demoCrew = on; persist(); }
});
/* Back button from Spotify's own error page: the browser may restore this page from its cache without re-running boot. */
addEventListener('pageshow', e => { if (e.persisted && cur()) Spotify.checkReturn(); });
/* ---------- boot ---------- */
loadDB();
if (DB.session && DB.users[DB.session]){ const u = DB.users[DB.session]; hydrate(u); seedIfNeeded(u); appEl.hidden = false; render(); Spotify.boot(); }
else { DB.session = null; showAuth(); }
</script>

</body>
</html>
