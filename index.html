    ${j.spaceman ? spacemanHTML(j, true) : ''}
    <div class="jmap recap-map">${routeSvg(j.id,340,170)}</div>
    ${summaryTiles(j)}
    ${scoresHTML(j)}
    ${info.celebrate.map((c,k) => celebrateCard(c, k === 0 && !j.spaceman)).join('')}
    ${others.length ? `<section class="stack-v">${secH('Miles together')}${info.friends.map(fpCard).join('')}</section>`
      : (info.guests.length ? '' : `<section class="card fact"><span class="ic-tile">${ic('users')}</span><div><b style="font-weight:500">Solo mission, still counted</b><p class="small muted">Miles with friends start the moment someone else gets in.</p></div></section>`)}
    ${info.guests.map(claimCard).join('')}
    ${rateHTML(j)}
    ${awardsHTML(j)}
    ${challengesHTML(j)}
    ${logHTML(j)}
    ${info.ach.map(a => `<section class="card fact"><span class="ic-tile ion">${ic(a.ic)}</span><div><span class="eyebrow ion">Achievement unlocked</span><b style="font-weight:600;display:block;margin-top:4px">${a.name}</b><p class="small muted">${a.desc}</p></div></section>`).join('')}
    <section>${secH('Share card')}${storyHTML(j)}</section>
    <div class="stack-v"><button class="btn btn-primary btn-lg btn-block" data-action="recap-mem" data-id="${j.id}">See it in Memories</button><button class="btn btn-ghost btn-block" data-action="recap-close">Back to home</button></div>`;
}
function closeLive(){ if (LJ) cancelAnimationFrame(LJ.raf); Voice.stop(); LJ = null; live.hidden = true; live.innerHTML = ''; live.className = ''; document.body.style.overflow = ''; }
function setTitle(id, v){
  const j = cur().journeys.find(x => x.id === id); if (!j) return;
  j.title = String(v).trim().slice(0,48); persist(); hydrate(cur()); toast(j.title ? 'Memory named' : 'Name cleared');
  if (live.hidden) refresh();
}

/* ---------- live actions ---------- */
const LIVE_ACTIONS = {
  plus: () => { const m = LJ && LJ.m; if (!m) return; m.count++; const n = $('#m-count'); if (n){ n.textContent = m.count; n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); } haptic(); },
  finish: () => { const m = LJ.m, M = MISSIONS[m.id]; LJ.crew.forEach(id => addPts(id, 1)); complete(`${plural(m.count, M.unit.replace(/s$/,''), M.unit)}. Everyone +1`); },
  reveal: () => { const m = LJ.m, [w, n] = Object.entries(m.votes).sort((a,b) => b[1] - a[1])[0]; complete(`${whoName(w)}, ${plural(n,'vote')}`); },
  'silent-start': () => { LJ.m.phase = 'run'; LJ.m.startMin = LJ.min; refreshMission(); },
  'silent-break': () => { LJ.m.phase = 'who'; refreshMission(); },
  skip: () => { nextMission(); refreshMission(); },
  next: () => { nextMission(); refreshMission(); },
  mode: (t, d) => { LJ.view = d.mode; renderHud(); live.scrollTo(0,0); },
  day: () => { LJ.day = !LJ.day; renderHud(); },
  voice: () => { LJ.voice = !LJ.voice; if (!LJ.voice) Voice.stop(); renderHud(); toast(LJ.voice ? 'Transmissions will be read aloud' : 'Voice off'); },
  end: () => endJourney(),
  warp: () => { LJ.min += 5; LJ.mi += 5*58/60; toast('Warped 5 mission minutes'); },
  'ev-ok': () => { LJ.ev = null; LJ.lastBeat = LJ.min; refreshEvent(); },
  'tx-new': () => txSheet(),
  'tx-queue': () => {
    const text = ($('#tx-text')?.value || '').replace(/\s+/g, ' ').trim();
    if (!text){ setText('tx-err', 'Write a message first.'); return; }
    const w = S.tx.when, at = LJ.min + (w === 'rand' ? 3 + Math.random()*9 : +w);
    LJ.txq.push({at, to:S.tx.to, text:text.slice(0,140)}); S.tx = {to:'crew', when:'5'};
    closeSheet(); updateTxCount(); toast('Transmission queued. Act natural.');
  },
  'tx-read': () => { if (LJ && LJ.tx && !Voice.speak(txSpeech(LJ.tx))) toast('Voice isn’t available in this browser. Read it out.'); },
  'tx-close': () => closeTx(),
  'tx-answered': () => { const tx = LJ.tx; if (!tx) return; addPts(LJ.captain, 1); tx.phase = 'verdict'; Voice.stop(); $('#tx-actions').innerHTML = txActions(tx); refreshBoard(); },
  'ca-unlock': () => { LJ.m.unlocked = true; refreshMission(); setTimeout(() => $('#ca-input')?.focus(), 60); },
  'ca-idea': () => { const i = $('#ca-input'); if (i) i.value = pickOne(LJ.m.prompt.ideas); },
  'ca-submit': () => {
    const m = LJ.m, v = ($('#ca-input')?.value || '').trim();
    if (!v){ setText('ca-err', 'Write something first. Anything.'); return; }
    m.answers.push({by:m.writers[m.answers.length], text:v.slice(0,90)}); m.unlocked = false; haptic();
    if (m.answers.length >= m.writers.length){ m.answers = shuffle(m.answers); m.phase = 'review'; }
    refreshMission();
  },
  'ca-read': () => { const m = LJ.m; if (!Voice.speak(`${m.prompt.q} ${m.answers.map((a,i) => `${'ABCDEF'[i]}. ${a.text}.`).join(' ')}`)) toast('Voice isn’t available here. Read them out yourselves.'); }
};
function onWho(id){
  const m = LJ && LJ.m; if (!m) return; const M = MISSIONS[m.id]; haptic();
  if (M.kind === 'winner'){
    m.tally[id] = (m.tally[id] || 0) + 1; const v = addPts(id, 1); m.round++;
    if (v > 1) toast(`Double Points! ${whoName(id)} +${v}`);
    if (m.round >= M.rounds){ const [w, n] = Object.entries(m.tally).sort((a,b) => b[1] - a[1])[0]; return complete(`${whoName(w)} won ${n} of ${M.rounds}`); }
    refreshBoard(); return refreshMission();
  }
  if (M.kind === 'vote'){ m.votes[id] = (m.votes[id] || 0) + 1; m.total++; toast('Vote counted. Pass it on'); return refreshMission(); }
  if (M.kind === 'silent'){ LJ.crew.filter(x => x !== id).forEach(x => addPts(x, 1)); return complete(`${whoName(id)} cracked after ${(LJ.min - m.startMin).toFixed(1)} minutes`); }
  if (M.kind === 'answers' && m.phase === 'guess'){
    const a = m.answers[m.fav], ok = id === a.by; addPts(a.by, 3); if (ok) addPts(LJ.captain, 2);
    m.reveal = {by:a.by, guess:id, ok};
    return complete(`“${a.text}” by ${whoName(a.by)}. Captain guessed ${ok ? 'right' : 'wrong'}.`);
  }
}

/* ---------- sign-in screen ---------- */
const authEl = $('#auth'), appEl = $('#app');
function showAuth(){
  document.title = 'Spaceman';
  const users = Object.values(DB.users).sort((a,b) => (b.lastSeen || 0) - (a.lastSeen || 0));
  authEl.className = 'auth';
  authEl.innerHTML = `<canvas aria-hidden="true"></canvas>
  <div class="auth-in">
    <div class="brandmark" style="--i:0"><svg viewBox="0 0 100 100"><use href="#helmet"/></svg><span>Spaceman</span></div>
    <div style="--i:1;display:flex;flex-direction:column;gap:14px"><span class="eyebrow ion">Prototype access</span><h1 class="display t-hero">Every mile together counts.</h1><p class="muted" style="max-width:34ch">Enter your email to start. A new email creates an account. A known email signs you straight back in.</p></div>
    <form id="auth-form" class="stack-v" style="--i:2" novalidate>
      <label class="field" for="auth-email">${ic('mail',18)}<input id="auth-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com"></label>
      <div id="code-wrap" hidden><label class="field" for="auth-code">${ic('gift',18)}<input id="auth-code" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Claim code, e.g. SPC-7Q4K" maxlength="12"></label></div>
      <p class="auth-err" id="auth-err" role="alert"></p>
      <button class="btn btn-primary btn-lg btn-block" id="auth-go" type="submit">Continue</button>
      <button class="link-btn" type="button" data-action="show-code" style="align-self:center">${ic('gift',16)}Got a claim code from a friend?</button>
    </form>
    ${users.length ? `<section style="--i:3"><div class="sec-h"><h2 class="sec">On this device</h2><span class="mono small muted">${users.length}</span></div>
      <div class="list">${users.map(u => `<button class="row" type="button" data-acct="${esc(u.email)}">${av(u.id,44)}<span class="grow"><b>${esc(fullName(u))}</b><span>${esc(u.email)}</span></span><span class="chip mono">${fmt(u.totalMiles || 0)} mi</span></button>`).join('')}</div></section>` : ''}
    <p class="small" style="--i:4;margin-top:auto;color:var(--fg-3)">Prototype sign-in with no password. Accounts are stored in this browser only.${storageOk ? '' : ' Storage is blocked here, so accounts last until you close this tab.'}</p>
  </div>`;
  authEl.hidden = false; appEl.hidden = true; document.body.style.overflow = 'hidden';
  new Starfield($('canvas', authEl), {speed:.2, n:130});
  if (matchMedia('(pointer:fine)').matches) $('#auth-email').focus({preventScroll:true});
}
function enterApp(after){
  authEl.classList.add('out'); appEl.hidden = false; document.body.style.overflow = '';
  setTimeout(() => { authEl.hidden = true; authEl.innerHTML = ''; authEl.className = 'auth'; }, reduce ? 0 : 330);
  render();
  if (after) setTimeout(after, reduce ? 0 : 450);
}
function go(email, code){
  const btn = $('#auth-go'), created = authenticate(email);
  let after = null;
  if (code){ const r = claimMiles(code); if (r.ok) after = () => claimedSheet(r); }
  const msg = created ? 'Account created' : `Welcome back, ${ME.name}`;
  if (btn){ btn.disabled = true; btn.innerHTML = `${ic('check',20,2.4)}${msg}`; } else toast(msg);
  setTimeout(() => enterApp(after), reduce ? 0 : (btn ? 800 : 150));
}
function signOut(){
  DB.session = null; persist(); if (!sheet.hidden){ sheet.hidden = true; sheet.innerHTML = ''; sheet.classList.remove('open'); } closeLive();
  if (location.hash !== '#home') history.replaceState(null, '', '#home');
  showAuth();
}

/* ---------- events ---------- */
const ACTIONS = {
  start: () => startJourney(),
  'edit-crew': () => editCrewSheet(),
  'edit-type': () => editTypeSheet(),
  shuffle: () => { const L = launchCfg(); L.lineup = shuffle(Object.keys(MISSIONS)).slice(0,3); persist(); refresh(); toast('New line-up'); },
  notes: () => notesSheet(),
  invite: () => addFriendSheet(false),
  claim: () => addFriendSheet(true),
  'show-code': t => { $('#code-wrap').hidden = false; t.hidden = true; $('#auth-code').focus(); },
  'go-with': (t, d) => { launchCfg().crew = [d.id]; persist(); closeSheet(); navTo('#go'); },
  'open-friend': (t, d) => friendSheet(d.id),
  switch: () => signOut(),
  sample: () => { loadSample(); toast('Sample data loaded'); refresh(); },
  reset: (t, d) => confirmTwice(t, () => { resetAccount(); toast('Account reset'); refresh(); }),
  delete: (t, d) => confirmTwice(t, () => { deleteAccount(); showAuth(); }),
  ...LIVE_ACTIONS,
  'recap-close': () => { closeLive(); navTo('#home'); },
  'recap-mem': (t, d) => { closeLive(); navTo('#memories'); setTimeout(() => memorySheet(d.id), 380); }
};
function confirmTwice(t, fn){
  const b = t.querySelector('b'), label = b.textContent;
  if (t.dataset.armed !== '1'){ t.dataset.armed = '1'; b.textContent = 'Tap again to confirm'; setTimeout(() => { if (b.isConnected){ t.dataset.armed = ''; b.textContent = label; } }, 3000); return; }
  fn();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action],[data-close],[data-f],[data-mem],[data-ach],[data-ms],[data-guest],[data-toggle],[data-pick],[data-vibe],[data-seat],[data-who],[data-ev],[data-mission],[data-acct],[data-addfriend],[data-copy],[data-avopt],[data-pu],[data-use],[data-steal],[data-dec],[data-txto],[data-txwhen],[data-txidea],[data-pickans],[data-rate],[data-verdict],[data-cap]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if ('close' in d && !d.action){ if (t.tagName === 'A') { closeSheet(); return; } return closeSheet(); }
  if (d.avopt){ const [k, v] = d.avopt.split(':'); return setAvatar({[k]:v}); }
  if (d.acct) return go(d.acct);
  if (d.copy) return copyText(d.copy);
  if (d.addfriend){ const r = addFriend(d.addfriend); if (r.err) return toast(r.err); closeSheet(); toast(`${r.ok} added to your crew`); return; }
  if (d.f) return friendSheet(d.f);
  if (d.mem) return memorySheet(d.mem);
  if (d.ach) return achSheet(d.ach);
  if (d.ms){ const [fid, k] = d.ms.split('|'); return msSheet(fid, k); }
  if (d.guest) return inviteSheet(d.guest);
  if (d.toggle){
    const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on);
    if (d.toggle in S.settings){ S.settings[d.toggle] = on; cur().settings = {...S.settings}; persist(); if (d.toggle === 'hc') document.documentElement.classList.toggle('hc', on); }
    return;
  }
  if (d.pick){ const L = launchCfg(); L.crew = L.crew.includes(d.pick) ? L.crew.filter(x => x !== d.pick) : [...L.crew, d.pick]; t.setAttribute('aria-pressed', L.crew.includes(d.pick)); if (![ME.id, ...L.crew].includes(L.captain)) L.captain = L.crew.find(x => !x.startsWith('g_')) || ME.id; L.seat = L.captain === ME.id ? 'driver' : 'passenger'; persist(); return; }
  if (d.vibe){ const L = launchCfg(); L.mode = d.vibe; L.lineup = [...VIBES[d.vibe].lineup]; document.querySelectorAll('[data-vibe]').forEach(b => b.setAttribute('aria-pressed', b.dataset.vibe === d.vibe)); $('#vibe-d').textContent = VIBES[d.vibe].line; persist(); return; }
  if (d.seat){ launchCfg().seat = d.seat; document.querySelectorAll('[data-seat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.seat === d.seat)); persist(); return; }
  if (d.who) return onWho(d.who);
  if (d.mission){ LJ.m = newM(d.mission); return refreshMission(); }
  if (d.pu) return powerSheet(d.pu);
  if (d.use){ const [pid, i] = d.use.split('|'); return usePower(pid, +i); }
  if (d.steal){ const [pid, i, tg] = d.steal.split('|'); return usePower(pid, +i, tg); }
  if (d.dec) return decide(d.dec);
  if (d.txto){ S.tx.to = d.txto; document.querySelectorAll('[data-txto]').forEach(b => b.setAttribute('aria-pressed', b.dataset.txto === d.txto)); return; }
  if (d.txwhen){ S.tx.when = d.txwhen; document.querySelectorAll('[data-txwhen]').forEach(b => b.setAttribute('aria-pressed', b.dataset.txwhen === d.txwhen)); return; }
  if (d.txidea){ const a = $('#tx-text'); if (a) a.value = d.txidea; setText('tx-err',''); return; }
  if ('pickans' in d){ LJ.m.fav = +d.pickans; LJ.m.phase = 'guess'; haptic(); return refreshMission(); }
  if (d.rate){ const [jid, k, n] = d.rate.split('|'); return setRating(jid, k, +n); }
  if (d.verdict){ logIt('signal', `Crew verdict on the Captain’s answer: ${d.verdict}`); toast(VERDICTS[d.verdict]); return closeTx(); }
  if (d.cap){ const L = launchCfg(); L.captain = d.cap; L.seat = d.cap === ME.id ? 'driver' : 'passenger'; document.querySelectorAll('[data-cap]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cap === d.cap)); persist(); return; }
  const A = ACTIONS[d.action]; if (A) A(t, d);
});
document.addEventListener('submit', e => {
  const id = e.target.id; if (!['auth-form','friend-form','claim-form','guest-form'].includes(id)) return;
  e.preventDefault();
  if (id === 'auth-form'){
    const v = $('#auth-email').value.trim().toLowerCase(), code = ($('#auth-code')?.value || '').trim();
    if (!EMAIL_RE.test(v)){ $('#auth-err').textContent = 'Enter a valid email address.'; return; }
    if (code){ const f = findClaim(code);
      if (!f){ $('#auth-err').textContent = 'That claim code doesn’t match any saved miles on this device.'; return; }
      if (f.owner.email === v){ $('#auth-err').textContent = 'That’s your own invite code. Send it to your friend instead.'; return; } }
    go(v, code);
  }
  if (id === 'friend-form'){ const r = addFriend($('#friend-email').value); if (r.err){ $('#friend-err').textContent = r.err; return; } closeSheet(); toast(`${r.ok} added to your crew`); }
  if (id === 'claim-form'){ const r = claimMiles($('#claim-code').value); if (r.err){ $('#claim-err').textContent = r.err; return; } refresh(); claimedSheet(r); }
  if (id === 'guest-form'){ const r = addGuest($('#guest-name').value); if (r.err){ $('#guest-err').textContent = r.err; return; } toast(`${r.ok.name} added as a guest`); editCrewSheet(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'auth-email' || id === 'auth-code') $('#auth-err').textContent = '';
  if (id === 'friend-email') $('#friend-err').textContent = '';
  if (id === 'claim-code') $('#claim-err').textContent = '';
  if (id === 'guest-name') $('#guest-err').textContent = '';
  if (id === 'display-name') setName(e.target.value);
  if (id === 'dest'){ launchCfg().dest = e.target.value.trim(); persist(); }
});
document.addEventListener('change', e => { if (e.target.matches('[data-title]')) setTitle(e.target.dataset.title, e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  if (e.key === 'Enter' && e.target.matches('[data-title]')) e.target.blur();
});

/* ---------- boot ---------- */
loadDB();
if (DB.session && DB.users[DB.session]){ const u = DB.users[DB.session]; hydrate(u); seedIfNeeded(u); appEl.hidden = false; render(); }
else { DB.session = null; showAuth(); }
</script>
