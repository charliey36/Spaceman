<script>
/* =========================================================================
   SPACEMAN v0.2 — "Friendship measured in miles travelled together"
   catalogues/  sample people, missions, awards, milestones, levels
   accounts/    localStorage users, session, guests + claim codes (swap for API)
   model/       friendship levels, milestones, streaks, recording journeys
   ui/          small render helpers returning HTML strings
   views/       home · crew · go · memories · you · brand
   live/        countdown → passenger mode / driver safe mode → recap
   FUTURE: markers are seams for real functionality.
   ========================================================================= */

/* ---------- catalogues ---------- */
const MOON = 238900, EARTH = 24901;
/* Spaceman avatars: one flat SVG astronaut head. 4 helmets × 4 visors × 4 suit accents × 3 faces = 192 looks. */
const AV = {
  h:{classic:'Classic', rounded:'Rounded', explorer:'Explorer', modern:'Modern'},
  v:{cyan:['Cyan','#5FE1F2'], blue:['Blue','#7C9CFF'], purple:['Purple','#B39CFF'], white:['White','#E9EDF5']},
  s:{cyan:['Cyan','#5FE1F2'], purple:['Purple','#B39CFF'], blue:['Blue','#6E8CFF'], silver:['Silver','#AEB6C4']},
  f:{eyes:'Simple', smile:'Smile', neutral:'Neutral'}
};
const AV_KEYS = {h:Object.keys(AV.h), v:Object.keys(AV.v), s:Object.keys(AV.s), f:Object.keys(AV.f)};
function hashAv(seed){ const r = rng('av:' + seed), p = k => AV_KEYS[k][Math.floor(r()*AV_KEYS[k].length)]; return {h:p('h'), v:p('v'), s:p('s'), f:p('f')}; }
function avatarSVG(c = {}){
  const W = '#F3F5F9', INK = '#0B0F1C', h = AV.h[c.h] ? c.h : 'classic';
  const vis = (AV.v[c.v] || AV.v.blue)[1], acc = (AV.s[c.s] || AV.s.cyan)[1];
  const helmet = {
    classic:`<circle cx="32" cy="28" r="19" fill="${W}"/>`,
    rounded:`<rect x="11" y="10" width="42" height="37" rx="18" fill="${W}"/>`,
    explorer:`<line x1="32" y1="11" x2="32" y2="5.5" stroke="${W}" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="4.8" r="2.6" fill="${acc}"/><rect x="10" y="23" width="7" height="12" rx="3.5" fill="${W}"/><rect x="47" y="23" width="7" height="12" rx="3.5" fill="${W}"/><circle cx="32" cy="29" r="18" fill="${W}"/>`,
    modern:`<path d="M14 30C14 16.5 22 9 32 9s18 7.5 18 21v8c0 5.5-4 9-9.5 9h-17C18 47 14 43.5 14 38z" fill="${W}"/><rect x="29" y="8" width="6" height="9" rx="3" fill="${acc}"/>`
  }[h];
  const [vx, vy, vw, vh] = {classic:[18,20,28,16], rounded:[16,19,32,17], explorer:[19,21,26,15], modern:[17,22,30,13]}[h];
  const cy = vy + vh/2, ey = c.f === 'eyes' ? cy : cy - 1.4;
  const mouth = c.f === 'smile' ? `<path d="M29 ${cy + 2.4}q3 2.6 6 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`
    : c.f === 'neutral' ? `<path d="M29.5 ${cy + 3.2}h5" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>` : '';
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#0D1017"/><rect width="64" height="64" fill="${acc}" opacity=".16"/>`
    + `<path d="M7 64c2-11 12-16.5 25-16.5S55 53 57 64z" fill="#D9DEE8"/><circle cx="41.5" cy="57.5" r="2.4" fill="${acc}"/>`
    + helmet + `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="${vh/2}" fill="${vis}"/>`
    + `<path d="M${vx + 4} ${vy + 3.4}q2.6-1.6 6.2-1.3" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>`
    + `<circle cx="27" cy="${ey}" r="1.9" fill="${INK}"/><circle cx="37" cy="${ey}" r="1.9" fill="${INK}"/>${mouth}`
    + `<rect x="21" y="44.5" width="22" height="5" rx="2.5" fill="${acc}"/></svg>`;
}
const SAMPLE_PEOPLE = {
  thomas:{name:'Thomas', full:'Thomas Hobbs',    av:{h:'classic',  v:'cyan',   s:'purple', f:'smile'}},
  megan: {name:'Megan',  full:'Megan Jefferies', av:{h:'rounded',  v:'purple', s:'cyan',   f:'smile'}},
  connor:{name:'Connor', full:'Connor Welland',  av:{h:'explorer', v:'blue',   s:'silver', f:'neutral'}},
  lewis: {name:'Lewis',  full:'Lewis Overall',   av:{h:'modern',   v:'white',  s:'blue',   f:'eyes'}},
  zac:   {name:'Zac',    full:'Zac Youlten',     av:{h:'explorer', v:'purple', s:'cyan',   f:'eyes'}},
  seb:   {name:'Seb',    full:'Seb Wright',      av:{h:'modern',   v:'cyan',   s:'silver', f:'smile'}},
  ollie: {name:'Ollie',  full:'Ollie Wong',      av:{h:'rounded',  v:'blue',   s:'purple', f:'neutral'}}
};
/* people from earlier sample data, so older saved journeys still render */
['Charlie','Graham','Maya','Theo','Priya','Jonah','Ellie'].forEach(n => { SAMPLE_PEOPLE[n.toLowerCase()] = {name:n, full:n, av:hashAv(n)}; });

/* Friendship levels: miles together is the only metric. L1 10 · L2 50 · L3 100 · L4 250 · L5 500, then gaps grow 6% a level. */
const FL = (() => { const t = [0,10,50,100,250,500]; let inc = 150; while (t.length < 80){ t.push(Math.round((t[t.length-1] + inc)/10)*10); inc *= 1.06; } return t; })();
const LEVEL_NAMES = [[0,'Just met'],[1,'Passengers'],[5,'Road buddies'],[10,'Co-pilots'],[15,'Ride or die'],[20,'Same orbit'],[30,'Basically family']];
const levelOf = mi => { let l = 0; while (l + 1 < FL.length && mi >= FL[l+1]) l++; return l; };
const levelName = l => LEVEL_NAMES.filter(([n]) => l >= n).pop()[1];
function lvInfo(mi){ const l = levelOf(mi), lo = FL[l], hi = FL[l+1] ?? lo; return {l, name:levelName(l), lo, hi, toNext:Math.max(0, Math.ceil(hi - mi)), pct: hi > lo ? (mi - lo)/(hi - lo)*100 : 100}; }

function routeSvg(id, W=320, H=116){
  const r = rng(id), n = 8, pts = [], k = Math.max(.6, Math.min(1, W/320));
  for (let i = 0; i < n; i++){
    const mid = i > 0 && i < n-1, t = i/(n-1);
    const x = W*.09 + t*W*.82 + (mid ? (r()-.5)*W*.07 : 0);
    const y = Math.max(H*.15, Math.min(H*.85, H*.76 - t*H*.52 + (mid ? (r()-.5)*H*.34 : 0)));
    pts.push([x,y]);
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < n-1; i++){ const [x,y] = pts[i], [nx,ny] = pts[i+1]; d += ` Q${x.toFixed(1)},${y.toFixed(1)} ${((x+nx)/2).toFixed(1)},${((y+ny)/2).toFixed(1)}`; }
  d += ` L${pts[n-1][0].toFixed(1)},${pts[n-1][1].toFixed(1)}`;
  const [sx,sy] = pts[0], [ex,ey] = pts[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--ion)" stroke-opacity=".18" stroke-width="${8*k}" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="url(#g-ion)" stroke-width="${2.4*k}" stroke-linecap="round"/>
    <circle cx="${sx}" cy="${sy}" r="${4.5*k}" fill="var(--void)" stroke="var(--fg)" stroke-width="${2*k}"/>
    <circle cx="${ex}" cy="${ey}" r="${11*k}" fill="var(--ion)" fill-opacity=".2"/>
    <circle cx="${ex}" cy="${ey}" r="${5*k}" fill="var(--fg)"/></svg>`;
}

/* ---------- model ---------- */
function weekStart(d){ const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return isoOf(x); }
function streakOf(js){
  const set = new Set(js.map(j => weekStart(dt(j.date)))), now = new Date(), weeks = [];
  for (let k = 7; k >= 0; k--){ const d = new Date(now); d.setDate(d.getDate() - 7*k); weeks.push(set.has(weekStart(d))); }
  const thisWeek = weeks[7]; let n = 0, k = thisWeek ? 0 : 1;
  while (k < 520){ const d = new Date(now); d.setDate(d.getDate() - 7*k); if (!set.has(weekStart(d))) break; n++; k++; }
  return {n, thisWeek, weeks};
}
function nearestLevelUp(){
  let best = null;
  FRIENDS.forEach(f => { const i = lvInfo(f.mi); if (i.toNext <= 0) return; if (!best || i.toNext < best.i.toNext) best = {f, i}; });
  return best;
}
const lastWith = id => JOURNEYS.find(j => j.crew.includes(id));
function topCrew(){
  const c = {}; JOURNEYS.forEach(j => { const k = j.crew.filter(x => x !== ME.id).sort().join(','); if (k) c[k] = (c[k] || 0) + 1; });
  const best = Object.entries(c).sort((a,b) => b[1] - a[1] || b[0].split(',').length - a[0].split(',').length)[0];
  return best ? {ids:best[0].split(','), n:best[1]} : null;
}
function makeAwards(j, scores){
  const r = rng(j.id + 'aw'), crew = [...j.crew];
  if (crew.length < 2) return [{who:crew[0], id:'solo', line:AWARDS.solo.line({})}];
  const pts = scores || {}, total = Object.values(pts).reduce((a,b) => a + b, 0);
  if (total > 0){ const pool = shuffle(['aux','backseat','competitive','silent','snack','services'], r); return crew.map((id,k) => { const a = pool[k % pool.length]; return {who:id, id:a, line:AWARDS[a].line({n:2 + Math.floor(r()*12)})}; }); }
  const champ = total ? Object.entries(pts).sort((a,b) => b[1] - a[1])[0][0] : crew[Math.floor(r()*crew.length)];
  const w = total ? pts[champ] : 2 + Math.floor(r()*3), t = total ? total : w + 1 + Math.floor(r()*3);
  const out = [{who:champ, id:'champion', line:AWARDS.champion.line({w, t})}];
  const pool = shuffle(['aux','backseat','competitive','silent','snack','services'], r);
  crew.filter(id => id !== champ).forEach((id, k) => { const a = pool[k % pool.length]; out.push({who:id, id:a, line:AWARDS[a].line({n:2 + Math.floor(r()*12)})}); });
  return out;
}
function updateMs(f, before, date){
  f.ms ||= {}; const out = [];
  MILESTONES.forEach(m => { if (!f.ms[m.k] && f.mi >= m.mi && before < m.mi){ f.ms[m.k] = date; out.push(m.k); } });
  return out;
}
function evalAch(u, j, when){
  const have = new Set(u.achievements.map(a => a.id)), out = [];
  const grant = id => { if (have.has(id)) return; have.add(id); u.achievements.push({id, got:when}); out.push({...ACH_DEFS.find(x => x.id === id), got:when}); };
  grant('first');
  if (u.totalMiles >= 1000) grant('k1');
  if (j.crew.length >= 5) grant('full');
  if (j.min >= 240) grant('mara');
  if (new Date().getHours() < 4) grant('owl');
  return out;
}
/* Saves the journey, updates miles together for everyone in the car, and reports what changed for the recap. */
function recordJourney(j){
  const me = cur(), when = monthYear(j.date), info = {friends:[], celebrate:[], guests:[], ach:[]};
  j.crew.forEach(pid => {
    if (pid === me.id) return;
    const g = me.guests.find(x => x.id === pid);
    if (g){ g.mi += j.mi; g.j += 1; g.first ||= j.date; info.guests.push({...g}); return; }
    const f = me.friends.find(x => x.id === pid); if (!f) return;
    const before = f.mi, lb = levelOf(before);
    f.mi += j.mi; f.j += 1; f.first ||= j.date;
    const crossed = updateMs(f, before, j.date), la = levelOf(f.mi);
    info.friends.push({id:pid, before, after:f.mi, gain:j.mi});
    if (la > lb) info.celebrate.push({type:'level', id:pid, level:la});
    crossed.forEach(k => info.celebrate.push({type:'ms', id:pid, k}));
  });
  me.journeys.unshift(j); me.journeyCount += 1; me.totalMiles += j.mi; me.xp += j.mi*4;
  info.ach = evalAch(me, j, when);
  j.crew.forEach(pid => {           /* other accounts on this device who were in the car */
    if (pid === me.id) return;
    const o = Object.values(DB.users).find(x => x.id === pid); if (!o) return;
    o.journeys ||= []; o.friends ||= [];
    o.journeys.unshift({...JSON.parse(JSON.stringify(j)), id:j.id + '-' + pid.slice(2,6), base:j.id});
    o.journeyCount = (o.journeyCount || 0) + 1; o.totalMiles = (o.totalMiles || 0) + j.mi;
    j.crew.forEach(q => { if (q === pid) return; const f = o.friends.find(x => x.id === q); if (f){ const b = f.mi; f.mi += j.mi; f.j += 1; f.first ||= j.date; updateMs(f, b, j.date); } });
    evalAch(o, j, when);
  });
  info.celebrate.sort((a,b) => (a.type === 'ms') - (b.type === 'ms'));
  persist(); hydrate(me); return info;
}
function addFriend(raw){

  const other = DB.users[email];
  if (!other) return {err:'No account for that email on this device yet. Sign in with it once to create it, then add them.'};
  const me = cur();
  if (me.friends.some(f => f.id === other.id)) return {err:`You’re already friends with ${firstName(other)}.`};
  const since = isoToday();
  me.friends.push({id:other.id, mi:0, j:0, first:null, since, ms:{}});
  other.friends ||= [];
  if (!other.friends.some(f => f.id === me.id)) other.friends.push({id:me.id, mi:0, j:0, first:null, since, ms:{}});
  if (me.launch && me.launch.crew.length < 3) me.launch.crew.push(other.id);

function findClaim(code){

/* A guest's saved miles become a real friendship for both people, with the journeys copied across. */
function claimMiles(code){
  const f = findClaim(code); if (!f) return {err:'That code doesn’t match any saved miles on this device.'};
  const me = cur(), {owner, g} = f;
  if (owner.id === me.id) return {err:'That’s your own invite code. Send it to them instead.'};
  const today = isoToday(), ms = {};
  MILESTONES.forEach(m => { if (g.mi >= m.mi) ms[m.k] = m.k === 'first' ? (g.first || today) : today; });
  const link = (a, b) => { let r = a.friends.find(x => x.id === b.id);
    if (r){ const before = r.mi; r.mi += g.mi; r.j += g.j; r.first = r.first && g.first ? (r.first < g.first ? r.first : g.first) : (r.first || g.first); updateMs(r, before, today); }
    else a.friends.push({id:b.id, mi:g.mi, j:g.j, first:g.first, since:today, ms:{...ms}}); };
  link(me, owner); link(owner, me);
  owner.journeys.forEach(j => {
    if (!j.crew.includes(g.id)) return;
    j.crew = j.crew.map(x => x === g.id ? me.id : x);
    (j.awards || []).forEach(a => { if (a.who === g.id) a.who = me.id; });
    me.journeys.push({...JSON.parse(JSON.stringify(j)), id:j.id + '-c' + me.id.slice(2,6)});
  });
  me.journeys.sort((a,b) => (b.date + (b.start || '')).localeCompare(a.date + (a.start || '')));
  me.totalMiles += g.mi; me.journeyCount += g.j;
  owner.guests = owner.guests.filter(x => x !== g);
  if (owner.launch) owner.launch.crew = owner.launch.crew.map(x => x === g.id ? me.id : x);
  DB.aliases[g.id] = me.id;
  if (me.launch && !me.launch.crew.includes(owner.id) && me.launch.crew.length < 3) me.launch.crew.push(owner.id);
  if (!me.achievements.some(a => a.id === 'claim')) me.achievements.push({id:'claim', got:monthYear(today)});
  persist(); hydrate(me);
  return {ok:true, ownerId:owner.id, owner:firstName(owner), mi:g.mi, j:g.j};
}

function chart(m){
  const W=340, H=170, L=34, R=W-4, T=18, B=134, mx = Math.max(...m.mi, 50);
  const steps = []; for (const p of [1,10,100,1000,10000]) for (const k of [1,1.5,2,2.5,3,4,5,6,8]) steps.push(k*p);
  const step = steps.find(v => v*3 >= mx) || 10000, max = step*3, y = v => B - (v/max)*(B - T), bw = (R - L)/12;
  const top = Math.max(...m.mi), peak = top > 0 ? m.mi.indexOf(top) : -1;
  let g = '';
  [0, step, step*2, step*3].forEach(v => { g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--fg-3)" font-family="Geist Mono, monospace">${fmt(v)}</text>`; });
  const bars = m.mi.map((v,i) => { const x = L + i*bw + bw*.2, w = bw*.6, t = y(v), now = i === 11, pk = i === peak;
    return `<rect x="${x}" y="${t}" width="${w}" height="${B - t}" rx="3" fill="${pk ? 'url(#g-ion)' : now ? 'var(--surface-3)' : 'var(--fg-3)'}" fill-opacity="${pk || now ? 1 : .55}"${now ? ' stroke="var(--fg-3)" stroke-dasharray="2 2"' : ''}><title>${m.full[i]}: ${fmt(v)} mi</title></rect>
      <text x="${x + w/2}" y="${B + 16}" text-anchor="middle" font-size="10.5" fill="${pk ? 'var(--fg)' : 'var(--fg-3)'}" font-family="Geist Mono, monospace">${m.labels[i]}</text>
      ${pk ? `<text x="${x + w/2}" y="${t - 7}" text-anchor="middle" font-size="11" fill="var(--fg)" font-family="Geist Mono, monospace">${fmt(v)}</text>` : ''}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Miles per month, last 12 months.${peak >= 0 ? ` Peak ${m.full[peak]} at ${fmt(top)} miles.` : ''}">${g}${bars}</svg>`;
}

/* ---------- starfield ---------- */
class Starfield {
  constructor(canvas, opts={}){
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.speed = opts.speed ?? .15; this.n = opts.n ?? 140; this.stars = [];
    this.resize(); for (let i = 0; i < this.n; i++) this.stars.push(this.mk(true));
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(canvas);
    this.loop = this.loop.bind(this); reduce ? this.draw() : requestAnimationFrame(this.loop);
  }
  mk(any){ return {x:(Math.random()-.5)*2, y:(Math.random()-.5)*2, z: any ? Math.random()*1 + .05 : 1.05, s:Math.random()}; }
  resize(){ const d = Math.min(devicePixelRatio || 1, 2), r = this.c.getBoundingClientRect(); this.w = r.width; this.h = r.height; this.c.width = r.width*d; this.c.height = r.height*d; this.ctx.setTransform(d,0,0,d,0,0); }
  draw(){
    const {ctx, w, h} = this; ctx.clearRect(0,0,w,h); const cx = w*.62, cy = h*.38, k = Math.max(w,h)*.5;
    for (const st of this.stars){
      const px = cx + st.x/st.z*k*.5, py = cy + st.y/st.z*k*.5;
      const a = Math.min(1, (1.05 - st.z)*1.3)*(.35 + st.s*.65), r = (1.1 - st.z)*1.3 + .2;
      if (this.speed > 1){ const pz = st.z + this.speed*.004, qx = cx + st.x/pz*k*.5, qy = cy + st.y/pz*k*.5;
        ctx.strokeStyle = `rgba(214,224,255,${a})`; ctx.lineWidth = r; ctx.beginPath(); ctx.moveTo(qx,qy); ctx.lineTo(px,py); ctx.stroke(); }
      else { ctx.fillStyle = `rgba(214,224,255,${a})`; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill(); }
    }
  }
  loop(){
    if (!this.c.isConnected){ this.ro.disconnect(); return; }
    for (const st of this.stars){ st.z -= .0009*this.speed*4; if (st.z < .04) Object.assign(st, this.mk(false)); }
    this.draw(); requestAnimationFrame(this.loop);
  }
}

const sheet = $('#sheet'), live = $('#live');
let lastFocus = null;
function openSheet(html){
  if (sheet.hidden) lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><button class="sheet-x" data-close aria-label="Close">${ic('x',18)}</button><div class="sheet-body">${html}</div></div>`;
  const wasOpen = !sheet.hidden;
  sheet.hidden = false; document.body.style.overflow = 'hidden';
  if (wasOpen) sheet.classList.add('open'); else requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  bindDrag(); setTimeout(() => $('.sheet-x', sheet)?.focus({preventScroll:true}), 50);

function closeSheet(){
  if (sheet.hidden) return; sheet.classList.remove('open');
  document.body.style.overflow = (!live.hidden || !$('#auth').hidden) ? 'hidden' : '';
  setTimeout(() => { if (sheet.classList.contains('open')) return; sheet.hidden = true; sheet.innerHTML = ''; lastFocus?.focus?.({preventScroll:true}); }, 380);
  if (DB.session && live.hidden && (location.hash === '#go' || location.hash === '#crew' || location.hash === '#home' || location.hash === '')) refresh();
}
function bindDrag(){
  const g = $('.grab', sheet), s = $('.sheet', sheet); let y0 = null, dy = 0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; s.style.transition = 'none'; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); s.style.transform = `translateY(${dy}px)`; });
  g.addEventListener('pointerup', () => { s.style.transition = ''; s.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; dy = 0; });
}

function toast(msg){ const t = $('#toast'); t.innerHTML = `<span class="ok">${ic('check',13,2.6)}</span>${esc(msg)}`; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function copyText(id){
  const el = $('#' + id); if (!el) return;
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it from here'); };
  try { navigator.clipboard.writeText(el.textContent.trim()).then(() => toast('Copied'), sel); } catch { sel(); }
}

/* ==========================================================================
   Mission engine. Pure logic, no DOM, so the same code can run:
   - on the Captain's phone as the mission host (today: in this tab),
   - in a Node balance simulation (docs/BALANCE.md),
   - FUTURE: on a server or host device behind a realtime transport.
   Devices never change state directly. They send intents with act(S, {type, by, ...});
   the host applies them and every device renders the same shared state from its own seat.

   Roles: Captain (driving), Co-Pilot (a passenger who taps things in for the Captain), Crew.
   An intent with as:'captain' from the Co-Pilot counts as the Captain's. The Captain can still tap directly.

   Pacing: one major thing at a time. Challenges, cosmic events, decisions, transmissions and power-up
   drops all go through one queue, with at least RULES.gap REAL seconds between them.
   ========================================================================== */

const Engine = (() => {
  const R = () => Math.random();
  const ri = (a, b) => a + Math.floor(R()*(b - a + 1));
  const rr = ([a, b]) => a + R()*(b - a);

  const pick = a => a[Math.floor(R()*a.length)];

  const lossText = r => r.blocked ? 'Shield absorbed the hit' : r.lost === 0 ? `Would have lost ${r.want} but was already at 0` : r.lost < r.want ? `−${r.lost}, all they had (${r.want} incoming)` : `−${r.lost}`;

  function startCh(S, id){

    say(S, {t:'haptic'}); bump(S);
  }
  /* Who won the challenge as a whole. Votes and Silent Missions are shared results, so nobody 'wins' them. */
  function chWinners(S, ch){
    if (ch.kind === 'trivia'){ const top = Math.max(0, ...Object.values(ch.fast || {})); return top ? Object.keys(ch.fast).filter(id => ch.fast[id] === top) : []; }
    if (ch.kind === 'estimate') return ch.rows && ch.rows.length ? ch.rows.filter(r => r[2] === ch.rows[0][2]).map(r => r[0]) : [];

  }
  function finishCh(S, result){

    }

    S.results.push([M.name, result]); S.done.push(ch.id); log(S, 'check', `${M.name}: ${result}`);

  }
  /* Trivia: answer times are measured in real seconds, because reactions happen in real time. */
  function openQ(S){
    const ch = S.ch, t = ch.qs[ch.round], order = shuf([0, 1, 2, 3]);

  function settleQ(S){

  }
  function nextQ(S){
    const ch = S.ch; ch.round++;
    if (ch.round < ch.rounds) return openQ(S);
    const w = Object.entries(ch.fast).sort((a, b) => b[1] - a[1]);
    finishCh(S, w.length ? `${nm(S, w[0][0])} was fastest on ${w[0][1]} of ${ch.rounds}` : 'Nobody got one right. Brains switched off for the drive.');
  }
  function settleEst(S){
    const ch = S.ch, A = ch.q.a, rows = Object.entries(ch.guesses).map(([id, v]) => [id, v, Math.abs(v - A)]).sort((a, b) => a[2] - b[2]);
    if (!rows.length) return finishCh(S, `Nobody guessed. It was ${A.toLocaleString('en-GB')}.`);

  }
  function newTarget(S, ch, prev){

  function settleVote(S){

  }
  function crack(S, who){

  }
  const mins = m => m < 1 ? `${Math.round(m*60)} seconds` : `${m.toFixed(1)} minutes`;
  function toPick(S){

  /* ---- events ---- */
  function runCosmic(S, k){
    const ids = S.crew, out = [];
    if (k === 'asteroid'){
      sample(ids, Math.min(ids.length, ri(2, 3)), id => S.pts[id] + 2).forEach(id => {
        const roll = R();
        if (roll < .2) return out.push({id, kind:'Near miss', text:fl(S, FLAVOUR.miss, id), d:'No damage', c:'ok'});
        const direct = roll > .65, r = loss(S, id, rng(direct ? PT.direct : PT.strike), 'event');
        out.push({id, kind:direct ? 'Direct hit' : 'Asteroid strike', text:fl(S, direct ? FLAVOUR.direct : FLAVOUR.strike, id), d:lossText(r), c:lossClass(r)});
      });
    }
    if (k === 'supply'){
      const ranked = [...ids].sort((a, b) => S.pts[a] - S.pts[b]);
      sample(ids, Math.min(ids.length, ri(1, 2)), id => (1 + (ids.length - ranked.indexOf(id)))*(id === S.copilot ? PT.coSupply : 1)).forEach(id => out.push({id, kind:'Supply drop', text:fl(S, FLAVOUR.supply, id), d:`+${gain(S, id, rng(PT.supply), 'event')}`, c:'good'}));
    }
    if (k === 'flare') sample(ids, Math.ceil(ids.length/2)).forEach(id => out.push({id, kind:'Solar flare', text:fl(S, FLAVOUR.flare, id), d:`+${gain(S, id, rng(PT.flare), 'event')}`, c:'good'}));
    if (k === 'hole'){
      const [a, b] = sample(ids, 2, id => S.pts[id] + 1), pa = S.pts[a], pb = S.pts[b];
      S.pts[a] = pb; S.pts[b] = pa; S.src[a].event += pb - pa; S.src[b].event += pa - pb; bump(S);
      out.push({id:a, kind:'Swapped', text:FLAVOUR.hole.replace('{a}', nm(S, a)).replace('{b}', nm(S, b)), d:`${pa} → ${pb}`, c:pb >= pa ? 'good' : 'bad'});
      out.push({id:b, kind:'Swapped', text:'', d:`${pb} → ${pa}`, c:pa >= pb ? 'good' : 'bad'});
    }
    S.ev = {type:'cosmic', k, out, until:S.min + RULES.evShow, id:++S.txId};
    log(S, COSMIC[k].ic, `${COSMIC[k].name}. ${out.map(o => `${nm(S, o.id)}: ${o.d}`).join(', ')}`);
    say(S, {t:'haptic'});
  }
  function pickCosmic(S){
    const total = S.crew.reduce((a, id) => a + S.pts[id], 0), w = [['supply',3],['flare',2]];
    if (total >= 8) w.push(['asteroid',4]);
    if (total >= 10 && S.crew.length > 2) w.push(['hole',1]);

  }
  function decide(S, choice, viaCo){

    const plus = (id, range, why) => out.push({id, kind:why, text:'', d:`+${gain(S, id, rng(range), 'event')}`, c:'good'});
    const minus = (id, range, why) => { const r = loss(S, id, rng(range), 'event'); out.push({id, kind:why, text:'', d:lossText(r), c:lossClass(r)}); };
    const pu = (id) => { const k = givePU(S, id); out.push({id, kind:'Power-up', text:'', d:k ? 'Got a power-up' : 'Inventory full', c:k ? 'ok' : 'zero'}); };

      else { S.agenda.unshift({at:S.min + 1.5, type:'cosmic', k:ids.length > 2 ? 'hole' : 'supply'}); const s = pick(ids); plus(s, PT.major, 'Wormhole jackpot'); text = `${nm(S, s)} grabbed something shiny on the way through. Something strange is coming.`; }

  const slotsOf = (S, id) => id === S.copilot ? PT.coSlots : PT.slots;

  function usePU(S, by, idx, target, viaCo){

  /* ---- the Co-Pilot seat ---- */
  const eligible = S => S.crew.filter(id => id !== S.captain && id !== S.copilot);
  /* Moves the seat. The perks go with it: the role's Shield and anything in the third power-up slot. */
  function setCopilot(S, id, how){

  function roll(S, auto){
    const e = S.ev; if (!e || e.type !== 'promo' || e.phase !== 'ready') return;

    log(S, 'dice', r === 6 ? `${nm(S, e.who)} rolled a 6 and was promoted to Co-Pilot${e.prev ? `. ${nm(S, e.prev)} stands down` : ''}` : r === 5 ? `${nm(S, e.who)} rolled a 5: +${e.gain}` : `${nm(S, e.who)} rolled a ${r}. No promotion`);
    say(S, {t:'haptic'}); bump(S);
  }
  function settleStruggle(S, opt){
    const e = S.ev; if (!e || e.type !== 'struggle' || e.phase !== 'q') return;
    e.ans = opt; e.ok = opt === e.cur.a; e.phase = 'done'; e.until = S.min + RULES.role.show + .4;
    if (e.ok) log(S, 'shield', `${nm(S, e.who)} answered correctly and keeps the Co-Pilot seat`);

    say(S, {t:'haptic'}); bump(S);
  }

  /* ---- transmissions ---- */
  function openTx(S, tx){
    tx.id = ++S.txId; tx.phase = tx.kind === 'captain' ? 'ask' : 'play'; tx.at = S.min; tx.reacts = {}; tx.said = {};
    if (tx.kind === 'captain') tx.botAnswerAt = S.min + rr(RULES.answerBy); else tx.until = S.min + RULES.txLen;
    S.tx = tx;
    log(S, 'signal', tx.kind === 'captain' ? `Captain question: ${tx.text}` : tx.kind === 'talk' ? `Discussion: ${tx.text}` : tx.kind === 'chatter' ? `Mission Control: ${tx.text}` : `Transmission: “${tx.text}”`);
    say(S, {t:'tx', id:tx.id});
  }
  function closeTx(S){
    const tx = S.tx; if (!tx) return;
    if (tx.kind === 'captain'){ const t = {}; Object.values(tx.reacts).forEach(v => { t[v] = (t[v] || 0) + 1; }); const top = Object.entries(t).sort((a, b) => b[1] - a[1])[0];
      if (top) log(S, 'signal', `Crew verdict on the Captain’s answer: ${top[0]}`); }
    S.tx = null; endMajor(S);
  }

  /* ---- intents from devices ---- */
  function act(S, a){
    const by = a.by; if (!S.crew.includes(by)) return null;
    const viaCo = a.as === 'captain' && by === S.copilot && by !== S.captain;   /* the Co-Pilot tapping in what the Captain said */
    const pid = viaCo ? S.captain : by, capOK = pid === S.captain, ch = S.ch;
    switch (a.type){
      case 'answer': if (ch && ch.kind === 'answers' && ch.phase === 'write' && pid !== S.captain && !ch.answers[pid] && a.text){ ch.answers[pid] = String(a.text).slice(0, 90); bump(S); if (Object.keys(ch.answers).length >= pass(S).length) toPick(S); } break;
      case 'pick': if (ch && ch.phase === 'pick' && capOK && ch.order[a.idx]){ ch.fav = ch.order[a.idx]; ch.phase = 'guess'; ch.viaCo = viaCo; ch.said = {}; ch.bot[S.captain] = S.min + rr(RULES.answers.guessBy); bump(S); } break;
      case 'guess': if (ch && ch.phase === 'guess' && capOK && pass(S).includes(a.who)){
        const ok = a.who === ch.fav; chGain(S, ch.fav, PT.answerAuthor, true); if (ok) chGain(S, S.captain, PT.captainGuess);
        ch.reveal = {by:ch.fav, guess:a.who, ok, text:ch.answers[ch.fav]};
        finishCh(S, `“${ch.answers[ch.fav]}” by ${nm(S, ch.fav)} (+${PT.answerAuthor}). Captain guessed ${ok ? `right (+${PT.captainGuess})` : 'wrong'}`); } break;
      case 'tq': if (ch && ch.kind === 'trivia' && ch.phase === 'q' && !ch.ans[pid] && a.opt >= 0 && a.opt < 4){
        let t = S.rt - ch.qAt;
        if (viaCo) t -= PT.proxyAllow;                                                      /* the Co-Pilot had to type it in */
        else if (pid === S.copilot && ch.ans[S.captain] && ch.ans[S.captain].viaCo) t -= PT.copilotAllow;   /* and typed the Captain's first */
        ch.ans[pid] = {opt:+a.opt, t, viaCo}; bump(S);
        if (Object.keys(ch.ans).length >= S.crew.length) settleQ(S); } break;

        if (ch && ch.kind === 'estimate' && ch.phase === 'est' && !(pid in ch.guesses) && Number.isFinite(v) && v >= 0){ ch.guesses[pid] = v; if (viaCo) ch.viaCo = true; bump(S); if (Object.keys(ch.guesses).length >= S.crew.length) settleEst(S); } } break;

function progress(){
  if (!LJ) return; const S = LJ.S, ch = S.ch, e = S.ev; let t = '';
  const gap = S.nextAt - S.rt;
  if (e && e.type === 'decision' && !e.chosen) t = `Captain decides · ${mmss(e.expires - S.min)} left`;
  else if (e && e.type === 'promo' && e.phase === 'ready') t = `${e.who === LJ.viewer ? 'Your roll' : `${S.names[e.who]} is rolling`} · auto-rolls in ${secs(e.autoAt - S.rt)}`;
  else if (e && e.type === 'struggle' && e.phase === 'q') t = `${secs(RULES.struggle.open - (S.rt - e.at))} to answer`;
  else if (ch && ch.phase === 'run') t = `Silent Mission · ${mmss(ch.len - (S.min - ch.runAt))} left`;
  else if (e) t = '';
  else if (!ch || ch.phase === 'done') t = gap > 0 ? `Next up in ${secs(gap)}` : 'Stand by';
  else if (ch.phase === 'write') t = `${Object.keys(ch.answers).length} of ${passengers().length} answers in · ${mmss(ch.deadline - S.min)} left`;
  else if (ch.phase === 'q') t = `${Object.keys(ch.ans).length} of ${S.crew.length} in · ${secs(Engine.timeLeft(S))} left`;
  else if (ch.phase === 'reveal') t = ch.round + 1 < ch.rounds ? `Next question in ${secs(ch.revealUntil - S.rt)}` : 'Final scores coming';
  else if (ch.phase === 'est') t = `${Object.keys(ch.guesses).length} of ${S.crew.length} locked in · ${mmss(ch.deadline - S.min)} left`;
  else if (ch.phase === 'vote') t = `${Object.keys(ch.votes).length} of ${S.crew.length} voted · ${mmss(ch.deadline - S.min)} left`;
  else if (ch.phase === 'look') t = `Searching · ${mmss(ch.giveUpAt - S.min)} until the target is lost`;
  else if (ch.phase === 'idle') t = 'Waiting for someone to start';
  else if (ch.phase === 'pick' || ch.phase === 'guess') t = 'Over to the Captain';
  setText('ch-prog', t);
  if (ch && ch.phase === 'run') setText('silent-left', mmss(ch.len - (S.min - ch.runAt)));
}

/* ---------- transmissions (each phone shows and reads them out on its own) ---------- */
const txKind = k => k === 'captain' ? 'Captain interview' : k === 'talk' ? 'Crew discussion' : k === 'chatter' ? 'Mission Control' : 'Incoming transmission';
const vary = (tx, a) => a[tx.id % a.length];
function txSpeech(tx){
  if (tx.kind === 'captain') return `${vary(tx, ['Captain, quick one for you.', 'Priority question for the Captain.', 'Captain. Mission Control here.'])} ${tx.text} Over.`;
  if (tx.kind === 'talk') return `${vary(tx, ['Mission Control to the crew.', 'Right then, crew.', 'Quick one for the whole car.', 'Crew, we need an answer on this.'])} ${tx.text} ${vary(tx, ['Over to you.', 'Discuss.', 'Go.'])} Over.`;
  if (tx.kind === 'chatter') return `${tx.text} ${vary(tx, ['Over.', 'Mission Control out.', 'Over and out.'])}`;
  return `Incoming transmission${tx.to === 'crew' ? ' for the whole crew' : tx.to === 'captain' ? ' for the Captain' : ` for ${LJ.S.names[tx.to]}`}. ${tx.text} Over.`;
}
function txTo(tx){
  if (tx.kind === 'captain') return `For Captain ${esc(capName())}`;
  if (tx.kind === 'talk') return 'To: entire crew · discuss';
  if (tx.kind === 'chatter') return 'To: entire crew · no reply needed';
  return `To: ${tx.to === 'crew' ? 'entire crew' : tx.to === 'captain' ? `Captain ${esc(capName())}` : esc(viewName(tx.to))}`;
}
function txActions(tx){
  const read = `<button class="btn btn-secondary btn-lg btn-block" data-action="tx-read">${ic('speaker',18)}Read aloud</button>`, close = `<button class="btn btn-ghost btn-block" data-action="tx-close">Close on this phone</button>`;
  if (tx.kind !== 'captain') return `${read}<button class="btn btn-primary btn-lg btn-block" data-action="tx-close">End transmission</button>`;
  if (tx.phase === 'ask'){
    if (isCap()) return `${read}<button class="btn btn-primary btn-lg btn-block" data-live="answered">I’ve answered out loud</button>${LJ.S.copilot ? `<p class="small muted">Or Co-Pilot ${esc(coName())} can tap it for you.</p>` : ''}`;
    if (isCo()){ const s = said(tx, 'answered'); return `${s ? `<p class="said">${esc(s.text)}</p>` : `<p class="co-hint">Tap once the Captain has answered.</p>`}<button class="btn btn-primary btn-lg btn-block" data-live="answered|cap">${ic('steer',18)}Captain has answered</button>${close}`; }
    return `${waiting(`Waiting for Captain ${esc(capName())} to answer`)}${close}`;
  }
  if (isCap()) return `${waiting('The crew is judging your answer')}${close}`;
  const mine = tx.reacts[LJ.viewer];
  return mine ? `<p class="m-done" style="justify-content:center">${ic('check',16,2.4)}You said: ${mine}</p>${close}` : `<span class="m-sub" style="text-align:center">Your verdict</span><div class="verdicts">${Object.keys(VERDICTS).map(x => `<button class="btn btn-secondary" data-live="react|${x}">${x}</button>`).join('')}</div>`;
}
function txOverlay(){
  const tx = LJ.S.tx, el = $('#tx', live);
  if (!tx || tx.id === LJ.hiddenTx){ if (el){ el.remove(); Voice.stop(); } return; }
  if (el && +el.dataset.id === tx.id){ setHTML('tx-actions', txActions(tx)); return; }
  el?.remove();
  const box = document.createElement('div');
  box.className = `tx ${tx.kind}`; box.id = 'tx'; box.dataset.id = tx.id; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label', txKind(tx.kind));
  box.innerHTML = `<div class="tx-in">
    <div class="radar" aria-hidden="true"><i></i><i></i><i></i><span class="core">${ic('signal',28)}</span></div>
    <span class="eyebrow tx-kind">${txKind(tx.kind)}</span><span class="tx-status" id="tx-status">Incoming signal</span>
    <div class="wave" aria-hidden="true">${Array.from({length:14}, (_,i) => `<i style="--d:${(i*67) % 480}ms"></i>`).join('')}</div>
    <div class="tx-body"><span class="tx-to">${txTo(tx)}</span><p class="tx-msg">“${esc(tx.text)}”</p><span class="tx-from">${tx.kind === 'crew' ? (tx.from === LJ.viewer ? 'From: you (they don’t know that)' : 'From: someone in this car') : 'From: Mission Control'}</span><div class="tx-actions" id="tx-actions">${txActions(tx)}</div></div></div>`;
  live.appendChild(box); delete LJ.cache['tx-actions']; haptic();

/* ---------- intents from this phone ---------- */
function liveAct(spec){
  if (!LJ) return; const parts = spec.split('|'), cap = parts[parts.length - 1] === 'cap', [a, x, y] = parts, S = LJ.S, v = LJ.viewer;
  const as = cap ? {as:'captain'} : {};
  switch (a){
    case 'devices': return devicesSheet();
    case 'menu': return menuSheet();
    case 'view': LJ.viewer = x; LJ.pickWho = null; closeSheet(); renderHud(); return toast(x === ME.id ? 'Back on your phone' : `Now on ${S.names[x]}’s phone · ${roleOf(x)}`);
    case 'pu': if (x === v) return powerSheet(); if (x === S.captain && isCo()) return powerSheet(null, true); return toast(`Only ${S.names[x]} can see and use their power-ups.`);
    case 'cap-pu': return powerSheet(null, true);
    case 'roll': Transport.send({type:'roll'}); return haptic();

  }
  if (d.pick){ const L = launchCfg(); L.crew = L.crew.includes(d.pick) ? L.crew.filter(x => x !== d.pick) : [...L.crew, d.pick]; t.setAttribute('aria-pressed', L.crew.includes(d.pick)); if (![ME.id, ...L.crew].includes(L.captain)) L.captain = L.crew.find(x => !x.startsWith('g_')) || ME.id; L.seat = L.captain === ME.id ? 'driver' : 'passenger'; persist(); return; }
  if (d.vibe){ const L = launchCfg(); L.mode = d.vibe; L.lineup = [...VIBES[d.vibe].lineup]; document.querySelectorAll('[data-vibe]').forEach(b => b.setAttribute('aria-pressed', b.dataset.vibe === d.vibe)); $('#vibe-d').textContent = VIBES[d.vibe].line; persist(); return; }
  if (d.seat){ launchCfg().seat = d.seat; document.querySelectorAll('[data-seat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.seat === d.seat)); persist(); return; }
  if (d.live){ if (!t.disabled) liveAct(d.live); return; }
  if (d.txto){ S.tx.to = d.txto; document.querySelectorAll('[data-txto]').forEach(b => b.setAttribute('aria-pressed', b.dataset.txto === d.txto)); return; }
  if (d.txwhen){ S.tx.when = d.txwhen; document.querySelectorAll('[data-txwhen]').forEach(b => b.setAttribute('aria-pressed', b.dataset.txwhen === d.txwhen)); return; }
  if (d.txidea){ const a = $('#tx-text'); if (a) a.value = d.txidea; setText('tx-err',''); return; }
  if (d.rate){ const [jid, k, n] = d.rate.split('|'); return setRating(jid, k, +n); }
  if (d.cap){ const L = launchCfg(); L.captain = d.cap; L.seat = d.cap === ME.id ? 'driver' : 'passenger'; document.querySelectorAll('[data-cap]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cap === d.cap));
    if (L.copilot === d.cap) L.copilot = ''; document.querySelectorAll('[data-copi]').forEach(b => { b.disabled = b.dataset.copi === d.cap; b.setAttribute('aria-pressed', b.dataset.copi === (L.copilot || 'auto')); }); persist(); return; }
  if (d.copi){ const L = launchCfg(); L.copilot = d.copi === 'auto' ? '' : d.copi; document.querySelectorAll('[data-copi]').forEach(b => b.setAttribute('aria-pressed', b.dataset.copi === d.copi)); persist(); return; }
  const A = ACTIONS[d.action]; if (A) A(t, d);
});
document.addEventListener('submit', e => {
  const id = e.target.id; if (!['auth-form','friend-form','claim-form','guest-form'].includes(id)) return;
  e.preventDefault();
  if (id === 'auth-form'){
    const v = $('#auth-email').value.trim().toLowerCase(), code = ($('#auth-code')?.value || '').trim();
    if (!EMAIL_RE.test(v)){ $('#auth-err').textContent = 'Enter a valid email address.'; return; }
    if (code){ const f = findClaim(code);
      if (!f){ $('#auth-err').textContent = 'That claim code doesn’t match any saved miles on this device.'; return; }
      if (f.owner.email === v){ $('#auth-err').textContent = 'That’s your own invite code. Send it to your friend instead.'; return; } }
    go(v, code);
  }
  if (id === 'friend-form'){ const r = addFriend($('#friend-email').value); if (r.err){ $('#friend-err').textContent = r.err; return; } closeSheet(); toast(`${r.ok} added to your crew`); }
  if (id === 'claim-form'){ const r = claimMiles($('#claim-code').value); if (r.err){ $('#claim-err').textContent = r.err; return; } refresh(); claimedSheet(r); }
  if (id === 'guest-form'){ const r = addGuest($('#guest-name').value); if (r.err){ $('#guest-err').textContent = r.err; return; } toast(`${r.ok.name} added as a guest`); editCrewSheet(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'auth-email' || id === 'auth-code') $('#auth-err').textContent = '';
  if (id === 'friend-email') $('#friend-err').textContent = '';
  if (id === 'claim-code') $('#claim-err').textContent = '';
  if (id === 'guest-name') $('#guest-err').textContent = '';
  if (id === 'display-name') setName(e.target.value);
  if (id === 'dest'){ launchCfg().dest = e.target.value.trim(); persist(); }
});
document.addEventListener('change', e => { if (e.target.matches('[data-title]')) setTitle(e.target.dataset.title, e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  if (e.key === 'Enter' && e.target.matches('[data-title]')) e.target.blur();
});

/* ---------- boot ---------- */
loadDB();
if (DB.session && DB.users[DB.session]){ const u = DB.users[DB.session]; hydrate(u); seedIfNeeded(u); appEl.hidden = false; render(); }
else { DB.session = null; showAuth(); }
</script>

</body>
</html>
